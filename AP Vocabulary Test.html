<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Economics 词汇卡片小测试</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background: linear-gradient(135deg,#eef3fb 0%,#f7f9fc 100%);
  min-height:100vh; color:#2b3a55;
}
.wrap { max-width:760px; margin:0 auto; padding:24px 16px calc(60px + env(safe-area-inset-bottom)); }

/* ===== 卡片通用 ===== */
.card {
  background:#fff; border-radius:18px; box-shadow:0 8px 30px rgba(31,78,121,.12);
  padding:36px 32px; margin-top:28px;
}
.card h1 { font-size:26px; color:#1f4e79; text-align:center; margin-bottom:6px; }
.card .sub { text-align:center; color:#8a97ad; font-size:13px; margin-bottom:26px; }
.field { margin-bottom:22px; }
.field label { display:block; font-size:14px; font-weight:600; color:#1f4e79; margin-bottom:8px; }
.field input[type=text], .field input[type=number] {
  width:100%; padding:12px 14px; border:2px solid #d8e2f0; border-radius:10px;
  font-size:16px; outline:none; transition:.2s;
}
.field input:focus { border-color:#2e74b5; }
.chip-options { display:flex; gap:12px; flex-wrap:wrap; }
.chip-options label {
  flex:1; min-width:130px; text-align:center; padding:14px 10px; cursor:pointer;
  border:2px solid #d8e2f0; border-radius:12px; font-size:15px; font-weight:600;
  color:#4a5a76; transition:.18s; user-select:none; background:#fafcff;
}
.chip-options label:hover { border-color:#2e74b5; }
.chip-options input { display:none; }
.chip-options label:has(input:checked) { background:#1f4e79; border-color:#1f4e79; color:#fff; }
.chip-options .cnt { display:block; font-size:11px; font-weight:400; opacity:.75; margin-top:2px; }
.chip-options label:has(input:checked) .cnt { opacity:.85; }
.btn-start {
  width:100%; padding:14px; border:none; border-radius:12px; font-size:17px; font-weight:700;
  background:linear-gradient(135deg,#1f4e79,#2e74b5); color:#fff; cursor:pointer; transition:.2s;
  letter-spacing:2px;
}
.btn-start:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(31,78,121,.35); }
.btn-start:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.hint { text-align:center; color:#b0bccd; font-size:12px; margin-top:12px; }
.toolbar { display:flex; gap:10px; margin-top:16px; }
.tool-btn {
  flex:1; padding:11px 8px; border:2px solid #d8e2f0; border-radius:10px; font-size:14px;
  font-weight:600; color:#4a5a76; background:#fafcff; cursor:pointer; transition:.15s;
}
.tool-btn:hover { border-color:#2e74b5; color:#1f4e79; background:#f0f6fd; }

/* ===== 测试界面 ===== */
.topbar { display:flex; justify-content:space-between; align-items:center; margin:14px 0 10px; gap:8px; flex-wrap:wrap; }
.topbar .user { font-weight:700; color:#1f4e79; }
.topbar .stat { font-size:13px; color:#4a5a76; background:#fff; padding:6px 12px; border-radius:20px; box-shadow:0 2px 8px rgba(31,78,121,.08); }
.topbar .timer { font-weight:700; color:#c0392b; }
.topbar .timer.warn { animation: blink .6s infinite; }
@keyframes blink { 50% { opacity:.35; } }
.progress { height:8px; background:#e3eaf5; border-radius:6px; overflow:hidden; margin-bottom:16px; }
.progress .bar { height:100%; background:linear-gradient(90deg,#2e74b5,#1f4e79); border-radius:6px; transition:width .3s; }

.quiz-card {
  background:#fff; border-radius:18px; box-shadow:0 8px 30px rgba(31,78,121,.12);
  padding:28px 26px; min-height:330px; display:flex; flex-direction:column;
}
.word-row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.word { font-size:34px; font-weight:800; color:#1f4e79; letter-spacing:.5px; }
.pos { font-size:14px; color:#0070c0; background:#eaf3fc; padding:3px 10px; border-radius:8px; }
.ex-label { font-size:12px; color:#8a97ad; margin-top:14px; margin-bottom:4px; }
.example { font-size:14.5px; color:#5a6a85; line-height:1.7; background:#f7f9fc; border-left:4px solid #b9d4f0; padding:12px 14px; border-radius:0 8px 8px 0; font-style:italic; }

.options { margin-top:22px; display:flex; flex-direction:column; gap:10px; }
.opt {
  display:flex; align-items:center; gap:12px; padding:13px 16px; border:2px solid #d8e2f0;
  border-radius:12px; cursor:pointer; transition:.15s; font-size:15.5px; background:#fafcff;
}
.opt:hover { border-color:#2e74b5; background:#f0f6fd; }
.opt .tag { width:28px; height:28px; border-radius:50%; background:#e3eaf5; color:#4a5a76; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
.opt.correct { border-color:#1e8e5a; background:#e8f8f0; }
.opt.correct .tag { background:#1e8e5a; color:#fff; }
.opt.wrong { border-color:#c0392b; background:#fdecec; }
.opt.wrong .tag { background:#c0392b; color:#fff; }
.opt.dim { opacity:.55; }
.opt.disabled { pointer-events:none; }

.feedback { margin-top:16px; padding:13px 16px; border-radius:12px; font-size:14.5px; line-height:1.6; display:none; }
.feedback.show { display:block; }
.feedback.right { background:#e8f8f0; color:#15593a; border:1px solid #b5e6cd; }
.feedback.wrong { background:#fdecec; color:#8f2d20; border:1px solid #f3c4bd; }
.feedback .cn { font-weight:700; font-size:16px; }

.btn-next {
  margin-top:18px; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:700;
  background:#1f4e79; color:#fff; cursor:pointer; transition:.2s; display:none;
}
.btn-next.show { display:block; }
.btn-next:hover { background:#2e74b5; }

/* ===== 结果界面 ===== */
.result-head { text-align:center; margin-bottom:20px; }
.result-head .big-score { font-size:64px; font-weight:800; color:#1f4e79; line-height:1.1; }
.result-head .pct { font-size:18px; color:#8a97ad; }
.stats { display:flex; gap:14px; justify-content:center; margin:18px 0; flex-wrap:wrap; }
.stats .item { background:#f0f6fd; border-radius:12px; padding:12px 22px; text-align:center; }
.stats .item .v { font-size:22px; font-weight:800; color:#1f4e79; }
.stats .item .k { font-size:12px; color:#8a97ad; margin-top:2px; }
.review { margin-top:18px; }
.review h3 { font-size:15px; color:#1f4e79; margin-bottom:10px; }
.review-item { display:flex; justify-content:space-between; gap:10px; padding:10px 14px; border-radius:10px; background:#fafcff; border:1px solid #e8eef7; margin-bottom:6px; font-size:14px; }
.review-item .w { font-weight:700; color:#1f4e79; white-space:nowrap; }
.review-item .a { color:#1e8e5a; font-weight:600; }
.review-item .u { color:#c0392b; text-decoration:line-through; margin-right:8px; }
.btn-again { margin-top:22px; padding:13px; border:none; border-radius:12px; font-size:16px; font-weight:700; background:linear-gradient(135deg,#1f4e79,#2e74b5); color:#fff; cursor:pointer; width:100%; }
.btn-again:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(31,78,121,.3); }
.save-note { text-align:center; font-size:12px; color:#8a97ad; margin-top:12px; }

/* ===== 历史记录弹层 ===== */
.mask { position:fixed; inset:0; background:rgba(31,50,80,.45); display:none; align-items:flex-end; justify-content:center; z-index:100; }
.mask.show { display:flex; }
.sheet {
  background:#fff; width:100%; max-width:760px; max-height:82vh; border-radius:20px 20px 0 0;
  display:flex; flex-direction:column; overflow:hidden;
}
.sheet-head { padding:18px 22px 14px; border-bottom:1px solid #e8eef7; display:flex; justify-content:space-between; align-items:center; }
.sheet-head h3 { font-size:17px; color:#1f4e79; }
.sheet-close { width:44px; height:44px; border:none; background:#eef3fb; color:#4a5a76; border-radius:12px; font-size:18px; cursor:pointer; }
.sheet-body { padding:14px 22px 20px; overflow-y:auto; }
.hist-item { border:1px solid #e8eef7; border-radius:12px; padding:12px 14px; margin-bottom:10px; background:#fafcff; }
.hist-item .row1 { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.hist-item .who { font-weight:700; color:#1f4e79; font-size:15px; }
.hist-item .meta { font-size:12px; color:#8a97ad; }
.hist-item .score { font-size:16px; font-weight:800; }
.hist-item .score.good { color:#1e8e5a; }
.hist-item .score.bad { color:#c0392b; }
.hist-item .badge { font-size:11px; background:#eaf3fc; color:#0070c0; padding:2px 8px; border-radius:8px; }
.hist-item .badge.range { background:#fdf3e7; color:#b97a1e; }
.hist-item .badge.cnt { background:#eef6ee; color:#1e7a4a; }
.hist-item .detail { margin-top:8px; font-size:12.5px; color:#5a6a85; line-height:1.6; display:none; }
.hist-item .detail.show { display:block; }
.hist-item .btn-toggle { font-size:12.5px; color:#2e74b5; background:none; border:none; cursor:pointer; padding:6px 0; text-decoration:underline; }
.hist-item .btn-del { font-size:12.5px; color:#c0392b; background:none; border:none; cursor:pointer; padding:6px 0 6px 12px; text-decoration:underline; }
.hist-empty { text-align:center; color:#b0bccd; padding:40px 0; font-size:14px; }
.sheet-actions { display:flex; gap:10px; margin-top:14px; }
.sheet-actions button {
  flex:1; padding:12px 8px; border:2px solid #d8e2f0; border-radius:10px; font-size:14px;
  font-weight:600; color:#4a5a76; background:#fafcff; cursor:pointer;
}
.sheet-actions button.danger { color:#c0392b; border-color:#f3c4bd; background:#fdf3f3; }
.sheet-actions button:hover { border-color:#2e74b5; }
.footer { text-align:center; color:#b0bccd; font-size:12px; margin-top:26px; }
.confirm-mask { position:fixed; inset:0; background:rgba(31,50,80,.5); display:none; align-items:center; justify-content:center; z-index:200; padding:24px; }
.confirm-mask.show { display:flex; }
.confirm-box { background:#fff; border-radius:16px; padding:26px 24px; max-width:340px; width:100%; text-align:center; }
.confirm-box p { font-size:15px; color:#2b3a55; line-height:1.6; margin-bottom:18px; }
.confirm-box .btns { display:flex; gap:12px; }
.confirm-box button { flex:1; padding:12px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; border:2px solid #d8e2f0; background:#fafcff; color:#4a5a76; }
.confirm-box button.ok { background:#c0392b; color:#fff; border-color:#c0392b; }
.confirm-box button.ok2 { background:#1f4e79; color:#fff; border-color:#1f4e79; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 开始界面 -->
  <div id="startScreen">
    <div class="card">
      <h1>📇 AP Economics 词汇卡片小测试</h1>
      <div class="sub">AP 微观 + AP 宏观 · 非术语词汇 · 显示词汇与例句，选出正确释义</div>
      <div class="field">
        <label>你的名字</label>
        <input type="text" id="nameInput" placeholder="请输入名字后开始" maxlength="20" autocomplete="off">
      </div>
      <div class="field">
        <label>词汇范围</label>
        <div class="chip-options" id="rangeBox">
          <label><input type="radio" name="range" value="all" checked><span>全部词汇</span><span class="cnt" id="cntAll"></span></label>
          <label><input type="radio" name="range" value="micro"><span>微观（Micro）</span><span class="cnt" id="cntMicro"></span></label>
          <label><input type="radio" name="range" value="macro"><span>宏观（Macro）</span><span class="cnt" id="cntMacro"></span></label>
        </div>
      </div>
      <div class="field">
        <label>本次测试词汇数量</label>
        <div class="chip-options" id="countBox">
          <label><input type="radio" name="count" value="10"><span>10 词</span></label>
          <label><input type="radio" name="count" value="20" checked><span>20 词</span></label>
          <label><input type="radio" name="count" value="50"><span>50 词</span></label>
          <label><input type="radio" name="count" value="100"><span>100 词</span></label>
          <label><input type="radio" name="count" value="all"><span>全部</span></label>
        </div>
        <div class="hint" id="countHint"></div>
      </div>
      <button class="btn-start" id="btnStart" onclick="startQuiz()">开 始 测 试</button>
      <div class="toolbar">
        <button class="tool-btn" onclick="openHistory()">📋 历史记录</button>
        <button class="tool-btn" onclick="exportBackup()">💾 导出备份</button>
        <button class="tool-btn" onclick="importBackup()">📥 导入恢复</button>
      </div>
      <div class="hint">每题限时 20 秒 · 选错会揭晓正确答案 · 测试结果自动保存</div>
    </div>
  </div>

  <!-- 测试界面 -->
  <div id="quizScreen" style="display:none">
    <div class="topbar">
      <span class="user" id="userLabel"></span>
      <span class="stat" id="progressLabel"></span>
      <span class="stat" id="scoreLabel"></span>
      <span class="stat timer" id="timerLabel">20</span>
    </div>
    <div class="progress"><div class="bar" id="progressBar"></div></div>
    <div class="quiz-card">
      <div class="word-row">
        <span class="word" id="wordText"></span>
        <span class="pos" id="posText"></span>
      </div>
      <div class="ex-label">例句：</div>
      <div class="example" id="exampleText"></div>
      <div class="options" id="optionsBox"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>

  <!-- 结果界面 -->
  <div id="resultScreen" style="display:none">
    <div class="card">
      <div class="result-head">
        <div style="font-size:20px;color:#4a5a76;margin-bottom:4px" id="resultUser"></div>
        <div class="big-score" id="resultScore"></div>
        <div class="pct" id="resultPct"></div>
      </div>
      <div class="stats">
        <div class="item"><div class="v" id="statCorrect"></div><div class="k">答对</div></div>
        <div class="item"><div class="v" id="statWrong"></div><div class="k">答错/超时</div></div>
        <div class="item"><div class="v" id="statTime"></div><div class="k">用时</div></div>
        <div class="item"><div class="v" id="statAcc"></div><div class="k">正确率</div></div>
      </div>
      <div class="review" id="reviewBox" style="display:none">
        <h3>📝 错题回顾</h3>
        <div id="reviewList"></div>
      </div>
      <button class="btn-again" onclick="location.reload()">再测一次</button>
      <div class="save-note" id="saveNote"></div>
    </div>
  </div>

  <div class="footer">AP Economics · 词汇卡片测试 · 微观 + 宏观 非术语词汇</div>
</div>

<!-- 历史记录弹层 -->
<div class="mask" id="histMask" onclick="if(event.target===this)closeHistory()">
  <div class="sheet">
    <div class="sheet-head">
      <h3>📋 历史测试记录</h3>
      <button class="sheet-close" onclick="closeHistory()">✕</button>
    </div>
    <div class="sheet-body" id="histList"></div>
    <div style="padding:0 22px 16px">
      <div class="sheet-actions">
        <button onclick="exportBackup()">💾 导出备份</button>
        <button onclick="importBackup()">📥 导入恢复</button>
        <button class="danger" onclick="confirmClearAll()">🗑 清空记录</button>
      </div>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="confirm-mask" id="confirmMask">
  <div class="confirm-box">
    <p id="confirmText">确定要执行此操作吗？</p>
    <div class="btns">
      <button onclick="hideConfirm()">取消</button>
      <button class="ok" id="confirmOkBtn" onclick="confirmAction()">确定</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none">

      const curIds = new Set(cur.map(r => r.id));

}
function updateCountHint(){
  const sel = document.querySelector('input[name=range]:checked').value;
  const n = rangeOf(sel).length;
  const c = document.querySelector('input[name=count]:checked');
  const want = c ? c.value : 'all';
  const will = want === 'all' ? n : Math.min(parseInt(want), n);
  document.getElementById('countHint').textContent =
    '当前范围共 ' + n + ' 词' + (want === 'all' ? '，将测试全部 ' + n + ' 词' : '，将随机抽 ' + will + ' 词');
}
document.querySelectorAll('input[name=range]').forEach(r => r.addEventListener('change', updateCountHint));
document.querySelectorAll('input[name=count]').forEach(r => r.addEventListener('change', updateCountHint));

/* ===== 测试流程 ===== */
function startQuiz() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { alert('请先输入你的名字 😊'); return; }
  const rangeSel = document.querySelector('input[name=range]:checked').value;
  const poolAll = rangeOf(rangeSel);
  if (!poolAll.length) { alert('当前范围没有词汇'); return; }
  const nSel = document.querySelector('input[name=count]:checked').value;
  // 数量不能超过范围总数（底层强制）
  const count = nSel === 'all' ? poolAll.length : Math.min(parseInt(nSel), poolAll.length);
  const pool = shuffle(poolAll).slice(0, count);
  const questions = pool.map(item => makeQuestion(item, poolAll));
  quiz = {
    user: name, questions, idx: 0, correct: 0, wrong: 0, startTime: Date.now(),
    rangeSel, count, total: questions.length
  };
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('userLabel').textContent = '🙋 ' + name;
  renderQuestion();
}

function makeQuestion(item, poolAll) {
  const wrongs = [];
  const seen = new Set([item.cn]);
  const pool = shuffle(poolAll).filter(d => d.cn !== item.cn && !seen.has(d.cn));
  for (const d of pool) { if (wrongs.length >= 3) break; wrongs.push(d.cn); seen.add(d.cn); }
  const allCns = shuffle(DATA.map(d => d.cn));
  for (const c of allCns) { if (wrongs.length >= 3) break; if (!seen.has(c)) { wrongs.push(c); seen.add(c); } }
  const options = shuffle([item.cn, ...wrongs.slice(0,3)]);
  return { item, options, correctIdx: options.indexOf(item.cn) };
}

function renderQuestion() {
  const q = quiz.questions[quiz.idx];
  document.getElementById('wordText').textContent = q.item.w;
  document.getElementById('posText').textContent = q.item.pos;
  document.getElementById('exampleText').textContent = q.item.ex || '（无例句）';
  document.getElementById('progressLabel').textContent = '第 ' + (quiz.idx+1) + ' / ' + quiz.questions.length + ' 题';
  document.getElementById('scoreLabel').textContent = '得分 ' + quiz.correct + ' / ' + quiz.idx;
  document.getElementById('progressBar').style.width = (quiz.idx / quiz.questions.length * 100) + '%';

  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  const tags = ['A','B','C','D'];
  q.options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'opt';
    el.innerHTML = '<span class="tag">' + tags[i] + '</span><span>' + opt + '</span>';
    el.onclick = () => answer(i, el);
    box.appendChild(el);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('btnNext').className = 'btn-next';
  startTimer();
}

function startTimer() {
  let left = TIME_PER_Q;
  const t = document.getElementById('timerLabel');
  t.textContent = left;
  t.classList.remove('warn');
  clearInterval(timer);
  timer = setInterval(() => {
    left--;
    t.textContent = left;
    if (left <= 5) t.classList.add('warn');
    if (left <= 0) { clearInterval(timer); timeout(); }
  }, 1000);
}

function answer(i, el) {
  clearInterval(timer);
  const q = quiz.questions[quiz.idx];
  q.userAnswer = i;
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.classList.add('disabled'));
  const fb = document.getElementById('feedback');

  if (i === q.correctIdx) {
    quiz.correct++;
    el.classList.add('correct');
    fb.className = 'feedback show right';
    fb.innerHTML = '✅ 答对了！<br><span class="cn">' + q.item.cn + '</span> &nbsp;—&nbsp; ' + q.item.en;
  } else {
    quiz.wrong++;
    el.classList.add('wrong');
    opts[q.correctIdx].classList.add('correct');
    opts.forEach((o, j) => { if (j !== i && j !== q.correctIdx) o.classList.add('dim'); });
    fb.className = 'feedback show wrong';
    fb.innerHTML = '❌ 选错了，正确答案是：<br><span class="cn">' + q.item.cn + '</span> &nbsp;—&nbsp; ' + q.item.en;
  }
  document.getElementById('btnNext').className = 'btn-next show';
  document.getElementById('scoreLabel').textContent = '得分 ' + quiz.correct + ' / ' + (quiz.idx+1);
}

function timeout() {
  const q = quiz.questions[quiz.idx];
  q.userAnswer = -1;
  quiz.wrong++;
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.classList.add('disabled'));
  opts[q.correctIdx].classList.add('correct');
  opts.forEach((o, j) => { if (j !== q.correctIdx) o.classList.add('dim'); });
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show wrong';
  fb.innerHTML = '⏰ 时间到！正确答案是：<br><span class="cn">' + q.item.cn + '</span> &nbsp;—&nbsp; ' + q.item.en;
  document.getElementById('btnNext').className = 'btn-next show';
  document.getElementById('scoreLabel').textContent = '得分 ' + quiz.correct + ' / ' + (quiz.idx+1);
}

function nextQuestion() {
  quiz.idx++;
  if (quiz.idx >= quiz.questions.length) { showResult(); return; }
  renderQuestion();
}

function showResult() {
  clearInterval(timer);
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  const total = quiz.questions.length;
  const pct = Math.round(quiz.correct / total * 100);
  const secs = Math.round((Date.now() - quiz.startTime) / 1000);
  document.getElementById('resultUser').textContent = quiz.user + ' 的成绩单';
  document.getElementById('resultScore').textContent = quiz.correct + ' / ' + total;
  document.getElementById('resultPct').textContent = pct + ' 分' + (pct >= 80 ? ' 🏆' : pct >= 60 ? ' 👍' : pct >= 40 ? ' 💪' : ' 📖');
  document.getElementById('statCorrect').textContent = quiz.correct;
  document.getElementById('statWrong').textContent = quiz.wrong;
  document.getElementById('statTime').textContent = secs + 's';
  document.getElementById('statAcc').textContent = pct + '%';

  const wrongItems = quiz.questions.filter(q => q.userAnswer !== q.correctIdx);
  renderReview(wrongItems);

  saveRecord(quiz, pct, secs, wrongItems);
}

function renderReview(items) {
  const box = document.getElementById('reviewBox');
  const list = document.getElementById('reviewList');
  if (!items.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  list.innerHTML = items.map(q =>
    '<div class="review-item"><span class="w">' + q.item.w + '</span><span><span class="a">' + q.item.cn + '</span></span></div>'
  ).join('');
}

/* ===== 历史记录 ===== */
function getHistory() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch(e) { return []; }
}
function setHistory(h) { localStorage.setItem(LS_KEY, JSON.stringify(h.slice(0, MAX_HIST))); }

function saveRecord(quiz, pct, secs, wrongItems) {
  const rangeNames = {all:'全部词汇', micro:'微观', macro:'宏观'};
  const rec = {
    id: Date.now(),
    time: new Date().toLocaleString('zh-CN', {hour12:false}),
    ts: Date.now(),
    user: quiz.user,
    range: quiz.rangeSel,
    rangeName: rangeNames[quiz.rangeSel] || '全部词汇',
    count: quiz.total,
    correct: quiz.correct,
    wrong: quiz.wrong,
    pct: pct,
    secs: secs,
    wrongList: wrongItems.map(q => ({w: q.item.w, cn: q.item.cn}))
  };
  const h = getHistory();
  h.unshift(rec);
  setHistory(h);
  document.getElementById('saveNote').textContent = '✅ 本次测试已自动保存到历史记录';
}

function openHistory() {
  const list = document.getElementById('histList');
  const h = getHistory();
  if (!h.length) {
    list.innerHTML = '<div class="hist-empty">还没有测试记录，快去测一次吧 📖</div>';
  } else {
    list.innerHTML = h.map(renderHistItem).join('');
  }
  document.getElementById('histMask').classList.add('show');
}
function closeHistory() { document.getElementById('histMask').classList.remove('show'); }

function renderHistItem(r, i) {
  const cls = r.pct >= 80 ? 'good' : (r.pct >= 60 ? '' : 'bad');
  const timeStr = (r.time || new Date(r.ts).toLocaleString('zh-CN', {hour12:false})).slice(0,16);
  const wrongInfo = r.wrongList && r.wrongList.length
    ? r.wrongList.map(w => w.w + ' → ' + w.cn).join('；')
    : '无';
  return '<div class="hist-item">' +
    '<div class="row1">' +
      '<span class="who">' + esc(r.user) + '</span>' +
      '<span class="meta">' + timeStr + '</span>' +
    '</div>' +
    '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
      '<span class="badge range">' + esc(r.rangeName) + '</span>' +
      '<span class="badge cnt">' + r.count + ' 词</span>' +
      '<span class="score ' + cls + '">' + r.correct + '/' + r.count + ' · ' + r.pct + '%</span>' +
      '<span class="meta" style="margin-left:auto">' + r.secs + 's</span>' +
    '</div>' +
    '<div style="margin-top:4px;display:flex;gap:4px">' +
      '<button class="btn-toggle" onclick="toggleHistDetail(' + i + ')">查看错题</button>' +
      '<button class="btn-del" onclick="confirmDeleteHist(' + i + ')">删除</button>' +
    '</div>' +
    '<div class="detail" id="histDetail' + i + '">错题：' + esc(wrongInfo) + '</div>' +
  '</div>';
}

function toggleHistDetail(i) {
  const d = document.getElementById('histDetail' + i);
  d.classList.toggle('show');
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showConfirm(text, okLabel, action) {
  document.getElementById('confirmText').textContent = text;
  const okBtn = document.getElementById('confirmOkBtn');
  okBtn.textContent = okLabel || '确定';
  okBtn.className = okLabel === '清空' ? 'ok' : 'ok2';
  pendingConfirm = action;
  document.getElementById('confirmMask').classList.add('show');
}
function hideConfirm() { document.getElementById('confirmMask').classList.remove('show'); pendingConfirm = null; }
function confirmAction() { if (pendingConfirm) pendingConfirm(); hideConfirm(); }

function confirmDeleteHist(i) {
  showConfirm('确定删除这条测试记录吗？', '删除', () => {
    const h = getHistory();
    h.splice(i, 1);
    setHistory(h);
    openHistory();
  });
}
function confirmClearAll() {
  showConfirm('确定清空全部历史记录吗？此操作不可恢复！', '清空', () => {
    setHistory([]);
    openHistory();
  });
}

/* ===== 备份与导入 ===== */
function exportBackup() {
  const h = getHistory();
  const payload = { app: 'AP Economics 词汇卡片测试', version: 2, exportedAt: new Date().toISOString(), records: h };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'AP-Economics-词汇测试记录备份-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
function importBackup() {
  document.getElementById('importFile').click();
}
document.getElementById('importFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const obj = JSON.parse(ev.target.result);
      const records = Array.isArray(obj) ? obj : (obj.records || []);
      if (!records.length) { alert('备份文件中没有记录'); return; }
      const h = getHistory();
      const merged = records.concat(h);
      const seen = new Set();
      const dedup = merged.filter(r => { const k = r.id || (r.ts + r.user); if (seen.has(k)) return false; seen.add(k); return true; });
      setHistory(dedup);
      alert('✅ 成功导入 ' + records.length + ' 条记录');
      if (document.getElementById('histMask').classList.contains('show')) openHistory();
    } catch(err) { alert('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
