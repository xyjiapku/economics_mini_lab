<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gains from Trade — Two Countries</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f7;--card:#fff;--border:#e8e5e0;--panel:#f5f3f0;
  --text:#1a1a1a;--sec:#5f5a55;--mut:#9e9890;
  --eng:#2563eb;--por:#059669;--amber:#d97706;--red:#dc2626;--green:#059669;--accent:#7c3aed;
  /* the same stack the courseware decks use — one family for everything,
     so this page is a drop-in next to a slide instead of a foreign object */
  --ui:"Segoe UI","Microsoft YaHei",system-ui,Arial,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ui);display:flex;flex-direction:column;overflow:hidden;
  /* the mono font used to keep the columns aligned; tabular figures do it now */
  font-variant-numeric:tabular-nums}

/* ── header ───────────────────────────────────────────────── */
.hdr{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:9px 16px 7px}
.hdr h1{font-size:21px;font-weight:700;line-height:1.1;white-space:nowrap}
.hdr .sub{font-size:13px;color:var(--sec);font-family:var(--ui);white-space:nowrap}
.scen{margin-left:auto;display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px}
.scen button{padding:8px 17px;border:0;border-radius:7px;cursor:pointer;background:transparent;color:var(--sec);
  font-family:var(--ui);font-size:13px;font-weight:600;transition:all .18s;white-space:nowrap}
.scen button.on{background:var(--accent);color:#fff}
.scen button:not(.on):hover{background:#efece8}

/* ── layout : work column 1/3  ｜  model column 2/3 ───────── */
.main{flex:1 1 0;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:13px;padding:0 14px 12px}

/* left third — what we know, and the derivation that got us there.
   THREE content blocks live here now: table 1, table 2 and the agree/refuse
   write-up.  space-between distributes the leftover height EQUALLY between
   them (four equal intervals) so the column reads as full, while every block
   keeps its own content height — the rows are not stretched (see .twrap).  */
.work{display:flex;flex-direction:column;gap:10px;min-height:0;
  justify-content:space-between;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 2px 18px rgba(0,0,0,.04);padding:11px 15px 12px}
/* pinned to the bottom by space-between now — an auto top margin would eat
   the whole free space and the blocks above would collapse onto one another */
.wktail{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
  border-top:1px solid var(--border);padding-top:9px}

/* right two thirds — the two PPCs, then the deal itself */
.stage{display:flex;flex-direction:column;gap:13px;min-height:0}
/* minmax(0,1fr), not 1fr: a plain 1fr has an auto minimum, so a longer
   read-out in a card footer used to widen that column and squeeze the table
   column beside it.  With the floor at zero the cards stay put and the
   footer ellipsises instead.                                             */
.charts{flex:1 1 0;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 2px 18px rgba(0,0,0,.04);padding:9px 12px 8px;display:flex;flex-direction:column;min-height:0}
.card .hd{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding-bottom:2px}
.card .hd .nm{font-size:19px;font-weight:700}
.card .hd .ca{margin-left:auto;font-family:var(--ui);font-size:13px;font-weight:700;
  padding:2px 10px;border-radius:999px;background:#f1eafe;color:#6d28d9;white-space:nowrap}
.card svg{flex:1 1 0;min-height:0;width:100%;height:100%;display:block}
.foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-family:var(--ui);font-size:16px;
  color:var(--sec);padding-top:4px;border-top:1px solid #f1efec;min-height:28px}
.foot .ro{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .bdg{margin-left:auto;flex:0 0 auto;font-size:13.5px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.bdg.good{background:#e7f6ee;color:#046a4b}
.bdg.bad{background:#f3eeec;color:#8a7b76}

/* ── terms-of-trade strip (bottom of the right two thirds) ──
   Its slot is RESERVED from the first step: the strip is drawn and laid out
   from the start and only its visibility flips at step 6.  Using display:none
   instead let .charts (flex:1 1 0) swallow the whole column, so the moment the
   strip appeared both PPC cards shrank and the two diagrams jumped 160px up.
   .pre only hides it — the space, and therefore the charts, never move.     */
.totcard{background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 2px 18px rgba(0,0,0,.04);padding:8px 15px 11px;flex:0 0 auto;
  display:flex;flex-direction:column;gap:2px}
.totcard.pre{visibility:hidden}
.totcard svg{width:100%;height:auto;display:block;touch-action:none}
.tothead{font-family:var(--ui);font-size:15px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent)}
.tothead b{font-size:18px;color:var(--red)}
/* the red dot on the number line IS the control — drag it, or focus the line
   and use ← → .  No duplicate slider underneath.                          */
#totSvg{cursor:grab}
#totSvg:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#totSvg.grabbing{cursor:grabbing}
.trow{display:flex;align-items:center;gap:10px;padding:3px 2px 0}
.trow .hint{font-family:var(--ui);font-size:13px;color:var(--mut)}
.trow label{font-family:var(--ui);font-size:17px;font-weight:600;white-space:nowrap;margin-left:auto}
.trow label b{color:var(--red);font-size:20px}

/* ── the two tables of the work column ───────────────────────
   Everything the class must read off is IN a table — no prose.  Type is
   deliberately large AND scales with the window: this column is read from
   the back of a classroom, and a bigger window means a bigger projector.

   Both tables are framed panels — an outer rule with clipped corners, a
   shaded header band and a faintly shaded label column — so the pair reads
   as two designed objects rather than two stacks of hairlines.            */
.rlab{font-family:var(--ui);font-size:clamp(13px,.8vw,16px);font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut)}

/* Each table used to STRETCH: it grew in proportion to its row count (--rg,
   from JS) so the two shared out all the height left once the controls were
   pinned at the bottom.  That looked right in the plan and wrong on screen —
   the column is ~850px tall and the content only needs ~310px, so a row that
   wants 62px was blown up to 174px and the numbers floated in a field of
   white.  Both tables are now content-sized: a row is one line plus
   comfortable padding, ~2.2 × the type at projector width — the normal
   proportion for a data row.  The leftover height is spent on the gaps
   between the three blocks instead (see .work{justify-content}).           */

/* the frame: one rule around the whole table, corners clipped by overflow */
.twrap{border:1.5px solid var(--border);border-radius:12px;overflow:hidden;
  background:var(--card);display:flex;flex-direction:column;min-height:0;
  flex:0 0 auto}
.twrap > table{width:100%}

/* ── table 1 — output per day.  Numbers are CENTRED in their columns; only
   the country label is left-aligned, and a rule separates label from data.

   table-layout:FIXED + the colgroup above: the four columns are measured
   once, from the widths declared here, and NOTHING that appears later — a
   marker, a digit in the OC column — can move a column again.  Auto layout
   was redistributing all four every time a cell's content grew.          */
table.dta{width:100%;border-collapse:collapse;table-layout:fixed;font-family:var(--ui);
  font-size:clamp(20px,1.45vw,29px);text-align:center}
table.dta col.w-cty{width:32%}
table.dta col.w-g1{width:24%}
/* 20%, not 18: a Wine cell holds a 2-digit number PLUS the abs./cmp. slot
   (26px at a 20px font), which comes to 54px.  At 18% the column was 53px at
   a 1024px window, so the slot dropped onto a SECOND line and the row grew
   from 45px to 71px.  The OC column was carrying 50px of slack at the same
   time, so the 2% comes straight off it.                                    */
table.dta col.w-g2{width:20%}
table.dta col.w-oc{width:24%}
/* one header size for all four cells.  The unit header "OC · 1 WINE" needs
   ~82px at 13px, which never fitted the fourth column at 1024 and wrapped to
   two lines there — worth 16px of needless table height.  At 11–15px it is
   one line at every width we ship to.                                      */
table.dta thead th{font-size:clamp(11px,.8vw,15px);font-weight:700;color:var(--sec);
  text-transform:uppercase;letter-spacing:.04em;text-align:center;
  padding:7px 2px;background:var(--panel);border-bottom:1.5px solid #ddd7cf}
/* 2px of side padding, not 6: the abs. / cmp. markers add real width to a
   cell, and a 1024px window only leaves a third of 1024 for the whole table */
table.dta tbody td{padding:clamp(8px,.85vh,15px) 2px;border-bottom:1px solid #f1efec}
table.dta tbody tr:last-child td{border-bottom:0}
table.dta th:first-child,table.dta td:first-child{text-align:left;
  border-right:1px solid var(--border)}
/* the country name must stay on ONE line.  It is the longest string in the
   table and it sits in the narrowest third of the window, so at 1024px the
   old clamp(22px…) min wrapped "Portugal" onto a second line and the row
   jumped from 47px to 71px.  The floor is now 18px and the cell is nowrap —
   _gft_shots.js measures the line-box count so a font change cannot bring the
   wrap back unnoticed.                                                      */
table.dta tbody td:first-child{background:#fbfaf7;font-weight:600;white-space:nowrap;
  font-size:clamp(18px,1.7vw,33px)}
table.dta .cn-e{color:var(--eng)}table.dta .cn-p{color:var(--por)}
table.dta td.pend{color:#c9c3bc}

/* ── the abs. / cmp. slot ──────────────────────────────────────
   abs. and cmp. SHARE ONE horizontal slot.  They used to be two inline
   boxes, so the browser laid the second one out AFTER the first — the pair
   was staggered sideways, which is exactly the width the sup/sub split was
   supposed to save.  Now: one inline-block whose width comes from a hidden
   "cmp." sizer (the wider of the two), and both markers absolutely pinned
   to its left edge — abs. raised above the baseline, cmp. dropped below it.

   height:0 on the box is belt-and-braces, not the proven fix.  A slot with a
   real height would join the line box, so revealing a marker could make the
   row taller.  Measurement showed the rows were already a flat 47px at every
   step with the slot visible or hidden, so the height was NOT what moved
   things (the real culprit was the Next button's label wrapping — see
   .btnrow below).  Zero height still guarantees the slot can never contribute
   height, so it stays.

   The slot is rendered at EVERY step, from step 0; an unearned marker is
   merely invisible.  So the cell's content width is settled before the
   lesson starts and can never shift a column.                           */
table.dta .mk{position:relative;display:inline-block;height:0;vertical-align:baseline;
  margin-left:.2em;font-size:.56em;font-weight:700;line-height:1;white-space:nowrap}
table.dta .mk .sz{visibility:hidden}
table.dta .mk .a,table.dta .mk .c{position:absolute;left:0;line-height:1}
table.dta .mk .off{visibility:hidden}
table.dta .mk .a{top:-.66em;color:#046a4b}
table.dta .mk .c{top:.8em;color:#6d28d9}

/* ── table 2 — the same three moments SIDE BY SIDE as column groups:
   AUTARKY │ SPECIALISE │ TRADE, each over CLOTH │ WINE, one row per country.
   Seven columns, so its type is a step down from table 1's — and the thing
   that sets the width floor is the group header, not the numbers.

   Also table-layout:fixed: the six unit columns are equal and the label
   column is a declared share, so a · turning into 128 cannot move a column. */
table.dta2{table-layout:fixed;font-size:clamp(16px,1.12vw,23px)}
table.dta2 col.w-cty2{width:22%}
table.dta2 tbody td:first-child{font-size:clamp(14px,.98vw,20px)}
table.dta2 thead th{background:transparent;border-bottom:0}
/* header row 1 — the moment.  Tinted to pick up the colour of the A / S / C
   marker the same bundle carries on the charts below.                    */
table.dta2 thead th.grp{font-weight:700;letter-spacing:.02em;
  font-size:clamp(10px,.95vw,13px);padding:clamp(4px,.7vh,8px) 1px;
  border-bottom:1px solid #e4dfd8}
table.dta2 thead th.g-aut{background:#fdf4e4;color:#b45309}
table.dta2 thead th.g-spe{background:#eef2fc;color:#1d4ed8}
table.dta2 thead th.g-tra{background:#e9f6ef;color:#046a4b}
/* a group that the lesson has not reached yet keeps the neutral tint — the
   colour arriving IS the cue that this moment is now on the table        */
table.dta2 thead th.grp.notyet{background:#f7f5f2;color:#bdb6ae}
/* header row 2 — the units, quiet and small */
table.dta2 thead th.sub{font-size:clamp(10px,.62vw,12px);font-weight:600;color:var(--mut);
  letter-spacing:.06em;padding:clamp(2px,.4vh,5px) 1px;border-bottom:1.5px solid #ddd7cf}
table.dta2 thead th.lead{background:var(--panel);border-right:1px solid var(--border);
  border-bottom:1.5px solid #ddd7cf;vertical-align:middle}
/* one divider per group edge keeps the three groups legible as three groups */
table.dta2 th.g1,table.dta2 td.g1{border-left:1px solid #e4dfd8}
table.dta2 tbody td{padding:clamp(6px,.7vh,12px) 1px}
table.dta2 tbody tr:last-child td{border-bottom:0}

/* the footer group of the work column: step read-out, then the buttons.
   The button row is a FIXED 47px.  It used to be sized by its own label, and
   "Next: Comparative advantage" wrapped to two lines while "Next: Autarky"
   did not — so the controls breathed in and out, the tables' share of the
   column changed with them, and both tables' rows drifted up and down in
   5px steps as the lesson advanced.  Now the row is one height for ever and
   a long label ellipsises instead.                                        */
.wktail .stepbar{display:flex;align-items:center;gap:10px;height:27px}
.stepbar .stnum{font-family:var(--ui);font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.stepbar .stnm{font-size:20px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btnrow{display:flex;gap:9px;height:47px}
#stReset{flex:0 0 auto;padding:0 15px;border:0;border-radius:10px;cursor:pointer;
  background:#f1eeea;color:var(--sec);font-family:var(--ui);font-size:14px;font-weight:600;line-height:1}
#stReset:hover{background:#e8e4df}
#stBtn{flex:1 1 auto;min-width:0;padding:0 10px;border:0;border-radius:10px;cursor:pointer;
  background:var(--accent);color:#fff;font-family:var(--ui);font-size:16px;font-weight:700;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .18s}
#stBtn:disabled{background:#e6e1dc;color:#a8a09a;cursor:default}

/* ── the write-up — country / agree-or-refuse / why, then the one-line
   summary.  It used to sit inside the deal strip under the charts, where a
   narrow column clipped it; it now lives in the left third, under the two
   tables, so the column has three blocks instead of two.
   That column is ~596px at 1920 but only ~294px at 1024, so the two
   countries STACK — two side-by-side columns only worked in a 1200px strip.
   It is reserved (visibility, not display) from step 0 like everything else,
   so the even distribution never shifts when it appears at step 6.          */
.fnds{display:flex;flex-direction:column;gap:9px;min-height:0}
.fnds.pre{visibility:hidden}
.fnd{border-left:3px solid #ded9d3;padding-left:12px}
.fnd.hot{border-left-color:var(--accent)}
.fnd.two{display:flex;flex-direction:column;gap:0}
/* a hairline between the two countries, since they no longer sit side by side */
.fnd.two .agr + .agr{border-top:1px solid #eae5df;padding-top:8px;margin-top:8px}
.fnd.two .sum{margin-top:4px;min-height:24px}
.fl{font-size:18.5px;line-height:1.3;color:var(--text)}
.fl + .fl{margin-top:1px}
.fl b{font-weight:700}
.fl.mut{color:var(--sec)}

/* country / agree-or-refuse / reason */
.agr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 9px}
.agr .an{font-size:19px;font-weight:700}
.agr .av{font-family:var(--ui);font-size:13.5px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.agr .av.ok{background:#e7f6ee;color:#046a4b}
.agr .av.no{background:#fdeceb;color:#9b2c26}
.agr .ar{flex:1 1 100%;font-size:18px;line-height:1.34;color:var(--sec)}
/* a reason runs to one line at projector widths and two once the column is
   as narrow as 1024; reserving two keeps the block's height — and so the
   height of the two PPC cards beside it — identical for every price the
   slider can reach.  Whole pixels, not em: a fractional reserve made the
   block 1px taller or shorter as the read-out text changed, and that 1px
   propagated into the grid row and nudged the whole left column.            */
.fnd.two .agr .ar{min-height:48px}

/* The 1/3 ｜ 2/3 board is THE layout — it never becomes a vertical stack just
   because the window is short (a preview panel always is).  A short window only
   means the page scrolls instead of squeezing the charts into nothing.
   (body goes display:block so the flex chain cannot collapse .main to zero.)

   ⚠️ 980, not 920: the left column carries two content-sized tables plus the
   write-up — about 610px of content at 1920px wide before any breathing room
   — so the one-screen layout wants roughly that much viewport.  Below it the
   page scrolls, with the two chart cards held at a fixed height instead.   */
@media (max-height:980px){
  html,body{height:auto;overflow:auto}
  body{display:block}
  .main{padding-bottom:20px}
  .charts{flex:0 0 auto}
  .card{height:clamp(330px,44vw,470px)}
}
/* only a genuinely narrow window may drop to one column */
@media (max-width:860px){
  .hdr{flex-wrap:wrap;gap:8px}
  .hdr h1{white-space:normal}
  .scen{margin-left:0}
  .main{display:block}
  .work{margin-bottom:13px}
  .wktail{margin-top:12px}
  .charts{margin-bottom:13px;flex:0 0 auto}
  /* ⚠️ flex:0 0 auto is load-bearing here: .charts is `flex:1 1 0` in the
     board layout, and with .main switched to display:block the .stage column
     has no definite height, so a 0 flex-basis collapsed the whole chart row
     to 0px and the two cards spilled over the strip below them.            */
  .card{height:auto;aspect-ratio:460/430}
}
@media (max-width:620px){
  .charts{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="hdr">
  <h1>Gains from Trade — Two Countries</h1>
  <div class="sub">cloth &amp; wine &nbsp;·&nbsp; price of 1 wine in cloth</div>
  <div class="scen" id="scenBar">
    <button data-s="A" class="on">A · one edge each</button>
    <button data-s="B">B · one leads both</button>
  </div>
</div>

<div class="main">

  <!-- ── left third : the tables, the write-up, the controls ────
       Three content blocks — table 1, table 2, the agree/refuse write-up —
       share the whole column, evenly (see .work{justify-content}).  The
       write-up used to sit under the deal strip on the right, where it was
       cut off at the bottom of the column; here it has room, and moving it
       out gives the two PPC charts that height instead.                    -->
  <div class="work">
    <div class="rlab">Output per day</div>

    <div class="twrap" id="tw1">
      <table class="dta">
        <colgroup>
          <col class="w-cty"><col class="w-g1"><col class="w-g2"><col class="w-oc">
        </colgroup>
        <thead id="dtaHead"></thead>
        <tbody id="dtaBody"></tbody>
      </table>
    </div>

    <div class="twrap" id="tbl2">
      <table class="dta dta2">
        <colgroup>
          <col class="w-cty2"><col span="6">
        </colgroup>
        <thead id="dta2Head"></thead>
        <tbody id="dta2Body"></tbody>
      </table>
    </div>

    <div class="fnds pre" id="fnds2" aria-hidden="true"></div>

    <div class="wktail">
      <div class="stepbar">
        <span class="stnum" id="stNum">1 / 8</span>
        <span class="stnm" id="stName">Output</span>
      </div>
      <div class="btnrow">
        <button id="stReset">Reset</button>
        <button id="stBtn">Next: Absolute advantage ▸</button>
      </div>
    </div>
  </div>

  <!-- ── right two thirds : the two PPCs, then the deal ── -->
  <div class="stage">
    <div class="charts">
      <div class="card">
        <div class="hd"><span class="nm" id="nmE">England</span><span class="ca" id="caE" style="display:none"></span></div>
        <svg id="svgE" viewBox="0 0 460 370" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="foot"><span class="ro" id="roE">—</span><span class="bdg" id="bdgE"></span></div>
      </div>
      <div class="card">
        <div class="hd"><span class="nm" id="nmP">Portugal</span><span class="ca" id="caP" style="display:none"></span></div>
        <svg id="svgP" viewBox="0 0 460 370" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="foot"><span class="ro" id="roP">—</span><span class="bdg" id="bdgP"></span></div>
      </div>
    </div>

    <div class="totcard pre" id="totCard" aria-hidden="true">
      <div class="tothead" id="totHead">6 · Terms of trade · 1 wine = <b>6.0</b> cloth</div>
      <svg id="totSvg" viewBox="0 0 1200 140" preserveAspectRatio="xMidYMid meet"
           tabindex="0" role="slider" aria-label="price of one wine in cloth"></svg>
      <div class="trow">
        <span class="hint">drag the red dot (or ← →)</span>
        <label>1 wine = <b id="totVal">6.0</b> cloth</label>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
'use strict';

/* ═══════════════════════════════════════════════════════════════
   1 · MODEL  —  single source of truth.  Everything on screen is
   derived from SCEN; nothing is hand-placed.
   ═══════════════════════════════════════════════════════════════ */

const SCEN = {
  A: {
    id:'A',
    eng:{name:'England',  C:200, W:20, color:'#2563eb'},
    por:{name:'Portugal', C:60,  W:30, color:'#059669'},
    axis:{min:1, max:11}
  },
  B: {
    id:'B',
    eng:{name:'England',  C:200, W:40, color:'#2563eb'},
    por:{name:'Portugal', C:90,  W:30, color:'#059669'},
    axis:{min:2, max:6}
  }
};

const Q_SHARE = 0.4;   // wine handed over = Q_SHARE × the wine-exporter's max wine

const STEPS = [
  {n:'Output',                nb:''},
  {n:'Absolute advantage',    nb:'Absolute advantage'},
  {n:'Opportunity cost',      nb:'Opportunity cost'},
  {n:'Comparative advantage', nb:'Comparative advantage'},
  {n:'Autarky',               nb:'Autarky'},
  {n:'Specialise',            nb:'Specialise'},
  {n:'Terms of trade',        nb:'Terms of trade'},
  {n:'Trade',                 nb:'Trade'}
];
const LAST = STEPS.length - 1;

function model(key, p){
  const s = SCEN[key];
  const c = { eng:Object.assign({}, s.eng), por:Object.assign({}, s.por) };
  for (const k of ['eng','por']){
    c[k].oc     = c[k].C / c[k].W;   // cloth given up per wine
    c[k].ocInv  = c[k].W / c[k].C;   // wine given up per cloth
  }
  c.eng.role = c.eng.oc < c.por.oc ? 'wine' : 'cloth';   // lower OC of wine exports wine
  c.por.role = c.eng.role === 'wine' ? 'cloth' : 'wine';
  const wineKey  = c.eng.role === 'wine' ? 'eng' : 'por';
  const clothKey = c.eng.role === 'wine' ? 'por' : 'eng';
  const q = Q_SHARE * c[wineKey].W;

  for (const k of ['eng','por']){
    const d = c[k];
    d.A  = { x: d.W/2, y: d.C/2 };                                    // autarky: midpoint
    d.S  = d.role === 'wine' ? { x: d.W, y: 0 } : { x: 0, y: d.C };   // specialise: endpoint
    d.dl = d.role === 'wine' ? { x:-q,   y:  p*q }                    // wine out, cloth in
                             : { x: q,   y: -p*q };
    d.Ct = { x: d.S.x + d.dl.x, y: d.S.y + d.dl.y };
    /* a linear PPC through (W,0) and (0,C): x/W + y/C = 1 */
    d.ratio  = d.Ct.x/d.W + d.Ct.y/d.C;
    d.beyond = d.ratio > 1 + 1e-9;
    d.onPpc  = Math.abs(d.ratio - 1) <= 1e-9;
  }
  const lo = Math.min(c.eng.oc, c.por.oc);
  const hi = Math.max(c.eng.oc, c.por.oc);
  const aaCloth = c.eng.C === c.por.C ? 'tie' : (c.eng.C > c.por.C ? 'eng' : 'por');
  const aaWine  = c.eng.W === c.por.W ? 'tie' : (c.eng.W > c.por.W ? 'eng' : 'por');
  const caWine  = c.eng.oc    < c.por.oc    ? 'eng' : 'por';
  const caCloth = c.eng.ocInv < c.por.ocInv ? 'eng' : 'por';
  return {
    key:key, p:p, cty:c, wineKey:wineKey, clothKey:clothKey, q:q, lo:lo, hi:hi,
    aaCloth:aaCloth, aaWine:aaWine, caWine:caWine, caCloth:caCloth,
    xmax:Math.max(c.eng.W, c.por.W), ymax:Math.max(c.eng.C, c.por.C), axis:s.axis
  };
}

/* ═══════════════════════════════════════════════════════════════
   2 · GEOMETRY HELPERS
   ═══════════════════════════════════════════════════════════════ */

/* Liang–Barsky segment clip against the plot box (model units). */
function clipSeg(x0,y0,x1,y1,xmin,ymin,xmax,ymax){
  let t0 = 0, t1 = 1;
  const dx = x1-x0, dy = y1-y0;
  const p = [-dx, dx, -dy, dy];
  const q = [x0-xmin, xmax-x0, y0-ymin, ymax-y0];
  for (let i=0;i<4;i++){
    if (p[i] === 0){ if (q[i] < 0) return null; continue; }
    const r = q[i]/p[i];
    if (p[i] < 0){ if (r > t1) return null; if (r > t0) t0 = r; }
    else         { if (r < t0) return null; if (r < t1) t1 = r; }
  }
  return [[x0+t0*dx, y0+t0*dy], [x0+t1*dx, y0+t1*dy]];
}

/* Sutherland–Hodgman polygon clip against the plot box. */
function clipPoly(poly, xmin, ymin, xmax, ymax){
  const cut = (pts, inside, cross) => {
    const out = [];
    for (let i=0;i<pts.length;i++){
      const a = pts[i], b = pts[(i+1)%pts.length];
      const ia = inside(a), ib = inside(b);
      if (ia){ out.push(a); if (!ib) out.push(cross(a,b)); }
      else if (ib){ out.push(cross(a,b)); }
    }
    return out;
  };
  const cutX = (a,b,x) => { const t=(x-a[0])/(b[0]-a[0]); return [x, a[1]+t*(b[1]-a[1])]; };
  const cutY = (a,b,y) => { const t=(y-a[1])/(b[1]-a[1]); return [a[0]+t*(b[0]-a[0]), y]; };
  let pts = poly;
  pts = cut(pts, p=>p[0]>=xmin, (a,b)=>cutX(a,b,xmin));
  pts = cut(pts, p=>p[0]<=xmax, (a,b)=>cutX(a,b,xmax));
  pts = cut(pts, p=>p[1]>=ymin, (a,b)=>cutY(a,b,ymin));
  pts = cut(pts, p=>p[1]<=ymax, (a,b)=>cutY(a,b,ymax));
  return pts;
}

const R2 = v => Math.round(v*100)/100;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = v => (Math.abs(v-Math.round(v)) < 1e-9) ? String(Math.round(v)) : v.toFixed(1);
const fmt2 = v => (Math.abs(v-Math.round(v)) < 1e-9) ? String(Math.round(v)) : v.toFixed(2);

/* ═══════════════════════════════════════════════════════════════
   3 · STATE
   ═══════════════════════════════════════════════════════════════ */

const state = { key:'A', p:6, step:0 };

/* ═══════════════════════════════════════════════════════════════
   4 · DRAW A COUNTRY CARD
   ═══════════════════════════════════════════════════════════════ */

/* B (the room under the x-axis) has to clear the S marker, which sits exactly
   on the axis at a country's wine intercept, before the tick numbers start. */
const BOX = { L:70, R:22, T:30, B:76 };
/* The chart canvas is 460 units wide and VH tall, and VH is FITTED to the
   card at render time (see fitViewBox) instead of being a constant.
   It used to be 370 — chosen when the two PPC cards were 594×452 and the
   write-up still sat under them in the right column.  Moving the write-up to
   the left column handed the cards ~320px of extra height, but with a fixed
   viewBox and preserveAspectRatio="meet" the extra height became letter-box
   white: the drawing stayed 1.22× and 111px of blank appeared above and
   below it inside each card.  Fitting VH to the card makes the drawing fill
   its frame at every window size — and because the scale is min(w/VW, h/VH),
   fitting makes it exactly w/VW, so the in-chart type keeps the rendered
   size it always had.                                                      */
const VW = 460;
let VH = 370;
const VH_MIN = 300, VH_MAX = 780;

const S = {
  l:(x1,y1,x2,y2,c,w,d)=>`<line x1="${R2(x1)}" y1="${R2(y1)}" x2="${R2(x2)}" y2="${R2(y2)}" stroke="${c}" stroke-width="${w}"${d?` stroke-dasharray="${d}"`:''}/>`,
  t:(x,y,s,sz,c,anc,fw,rot)=>`<text x="${R2(x)}" y="${R2(y)}" font-size="${sz}" fill="${c}"`+
        ` text-anchor="${anc||'middle'}"${fw?` font-weight="${fw}"`:''}`+
        `${rot?` transform="rotate(${rot} ${R2(x)} ${R2(y)})"`:''}`+
        ` font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif">${esc(s)}</text>`,
  c:(x,y,r,f,st)=>`<circle cx="${R2(x)}" cy="${R2(y)}" r="${r}" fill="${f}"${st?` stroke="${st}"`:''}/>`
};

/* fit the canvas to the card before drawing: the card is a flex slice of the
   right column, so its aspect changes with the window, and the viewBox has to
   follow it or the drawing letter-boxes.  Only VH moves — VW stays 460 so the
   x-axis keeps its length and the type keeps its size.                     */
function fitViewBox(){
  const svg = document.getElementById('svgE');
  if (!svg) return;
  const r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const fitted = Math.max(VH_MIN, Math.min(VH_MAX, Math.round(VW * r.height / r.width)));
  if (fitted !== VH){
    VH = fitted;
    for (const id of ['svgE','svgP'])
      document.getElementById(id).setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
  }
}

function drawCountry(svg, m, whom){
  const d = m.cty[whom];
  const st = state.step;
  const xmax = m.xmax, ymax = m.ymax;
  const px = v => BOX.L + (v/xmax) * (VW-BOX.L-BOX.R);
  const py = v => (VH-BOX.B) - (v/ymax) * (VH-BOX.T-BOX.B);
  let s = '';

  /* ---- fill: extra consumption possibilities unlocked by trade ----
     the region above the PPC and below the terms-of-trade line.  For the cloth
     exporter that region runs on past its own wine intercept, right down to
     where the trading line meets the wine axis (C/p) — closing it at x = W
     would leave an artificial vertical edge in the middle of the picture.   */
  if (st >= 7){
    let tri = null;
    if (d.role === 'cloth' && m.p <= d.oc - 1e-12)
      tri = [[0,d.C], [d.W,0], [d.C/Math.max(m.p,1e-6), 0]];
    else if (d.role === 'wine' && m.p >= d.oc + 1e-12)
      tri = [[0,d.C], [0, m.p*d.W], [d.W, 0]];
    if (tri){
      const cl = clipPoly(tri, 0, 0, xmax, ymax);
      if (cl.length > 2)
        s += `<polygon points="${cl.map(p=>R2(px(p[0]))+','+R2(py(p[1]))).join(' ')}" fill="#059669" opacity="0.13"/>`;
    }
  }

  /* ---- axes ---- */
  s += S.l(BOX.L, VH-BOX.B, VW-BOX.R+8, VH-BOX.B, '#343a40', 3.2);
  s += S.l(BOX.L, VH-BOX.B, BOX.L, BOX.T-9, '#343a40', 3.2);
  s += S.t(21, (BOX.T+VH-BOX.B)/2, 'Cloth', 19, '#343a40', 'middle', 700, -90);
  s += S.t((BOX.L+VW-BOX.R)/2, VH-12, 'Wine', 19, '#343a40', 'middle', 700);

  /* ---- axis ticks ---- */
  const yt = [ymax, ymax/2], xt = [xmax, xmax/2];
  yt.forEach(v=>{
    s += S.l(BOX.L-7, py(v), BOX.L, py(v), '#8d99a6', 2);
    s += S.t(BOX.L-12, py(v)+6, fmt(v), 16, '#5f5a55', 'end');
  });
  xt.forEach(v=>{
    s += S.l(px(v), VH-BOX.B, px(v), VH-BOX.B+7, '#8d99a6', 2);
    s += S.t(px(v), VH-BOX.B+28, fmt(v), 16, '#5f5a55', 'middle');
  });

  /* ---- this country's own intercepts, in its colour ---- */
  const isTick = (v, arr) => arr.some(t => Math.abs(v - t) < 1e-9);
  const halo = (x, y, v, c, anc, sz) =>
    `<text x="${R2(x)}" y="${R2(y)}" font-size="${sz||16}" font-weight="700" fill="${c}" text-anchor="${anc}" `+
    `stroke="#fff" stroke-width="4" paint-order="stroke" `+
    `font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif">${v}</text>`;
  if (!isTick(d.C, yt)){
    if (yt.every(t => Math.abs(py(d.C) - py(t)) >= 38)) s += halo(BOX.L-12, py(d.C)+6, fmt(d.C), d.color, 'end');
    else                                                s += halo(BOX.L+11, py(d.C)+6, fmt(d.C), d.color, 'start');
  }
  if (!isTick(d.W, xt)){
    if (xt.every(t => Math.abs(px(d.W) - px(t)) >= 38)) s += halo(px(d.W), VH-BOX.B+28, fmt(d.W), d.color, 'middle');
    else                                                s += halo(px(d.W), VH-BOX.B-11, fmt(d.W), d.color, 'middle');
  }

  /* ---- PPC ---- */
  s += S.l(px(0), py(d.C), px(d.W), py(0), d.color, 4.5);

  /* ---- slope step: the slope IS the opportunity cost (steps 3–4 = OC / CA) ---- */
  if (st >= 2){
    const dw = d.W/4;
    const x1 = dw, y1 = d.C, y2 = d.C - dw*d.oc;
    s += S.l(px(0), py(d.C), px(x1), py(y1), d.color, 1.6, '5 4');
    s += S.l(px(x1), py(y1), px(x1), py(y2), d.color, 1.6, '5 4');
    /* the caption is only safe to show before A / S / C enter the picture */
    if (st <= 3) s += halo(px(x1)+10, py((y1+y2)/2)+6, '1 wine = ' + fmt(d.oc) + ' cloth', d.color, 'start', 16);
  }

  /* ---- trading line through S, slope −p ---- */
  if (st >= 7){
    const far = d.role === 'cloth' ? [[0,d.C],[d.C/Math.max(m.p,1e-6),0]]
                                   : [[d.W,0],[0, m.p*d.W]];
    const seg = clipSeg(far[0][0],far[0][1],far[1][0],far[1][1],0,0,xmax,ymax);
    if (seg) s += S.l(px(seg[0][0]), py(seg[0][1]), px(seg[1][0]), py(seg[1][1]), '#ea580c', 2.8, '9 6');
  }

  /* ---- the move actually made: S → C, drawn UNDER the markers ----
     solid red so that it is unmistakably "the part of the terms-of-trade line
     that is actually used", against the dashed orange full line            */
  if (st >= 7){
    s += S.l(px(d.S.x), py(d.S.y), px(d.Ct.x), py(d.Ct.y), '#dc2626', 3.4, '');
    s += `<g opacity="0.55">`+
         S.l(px(0), py(d.Ct.y), px(d.Ct.x), py(d.Ct.y), '#dc2626', 1.5, '3 3')+
         S.l(px(d.Ct.x), py(d.Ct.y), px(d.Ct.x), py(0), '#dc2626', 1.5, '3 3')+
         `</g>`;
  }

  /* ---- markers: A / S / C — always on top of every line ---- */
  const dot = (x, y, r, fill, letter) => {
    let o = S.c(px(x), py(y), r, fill, '#fff');
    o += `<text x="${R2(px(x))}" y="${R2(py(y)+5.2)}" font-size="15" font-weight="700"
            fill="#fff" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif">${letter}</text>`;
    return o;
  };
  if (st >= 4) s += dot(d.A.x, d.A.y, 10.5, '#f59e0b', 'A');
  if (st >= 5) s += dot(d.S.x, d.S.y, 10.5, d.color, 'S');
  if (st >= 7) s += dot(d.Ct.x, d.Ct.y, 11.5, d.beyond ? '#dc2626' : '#a09a92', 'C');
  svg.innerHTML = s;
}

/* ═══════════════════════════════════════════════════════════════
   5 · DRAW THE TERMS-OF-TRADE NUMBER LINE
   ═══════════════════════════════════════════════════════════════ */

const TOT = { L:72, R:40, y:96, W:1200 };
const totX = (v, m) => TOT.L + ((v - m.axis.min)/(m.axis.max - m.axis.min)) * (TOT.W - TOT.L - TOT.R);

function drawTot(m){
  const svg = document.getElementById('totSvg');
  const a = m.axis.min, b = m.axis.max;
  const wa = m.cty[m.wineKey], ca = m.cty[m.clothKey];
  const xl = totX(m.lo, m), xh = totX(m.hi, m);
  let s = '';

  s += `<rect x="${R2(xl)}" y="${TOT.y-28}" width="${R2(xh-xl)}" height="56" fill="#059669" opacity="0.14" rx="7"/>`;
  s += S.l(xl, TOT.y-28, xl, TOT.y+28, '#059669', 3.4, '7 5');
  s += S.l(xh, TOT.y-28, xh, TOT.y+28, '#059669', 3.4, '7 5');
  s += S.t((xl+xh)/2, 25, 'MUTUALLY BENEFICIAL ZONE', 22, '#046a4b', 'middle', 700);

  s += S.l(totX(a,m), TOT.y, totX(b,m), TOT.y, '#343a40', 3.4);
  s += S.t(totX(a,m)+3, TOT.y-15, 'cloth per wine →', 18, '#5f5a55', 'start');
  for (let t = Math.ceil(a); t <= Math.floor(b); t++){
    s += S.l(totX(t,m), TOT.y-9, totX(t,m), TOT.y+9, '#8d99a6', 2);
    s += S.t(totX(t,m), TOT.y+34, String(t), 20, '#5f5a55', 'middle');
  }
  s += S.t(xl, 52, wa.name + "'s OC = " + fmt(m.lo), 21, '#0e7fae', 'middle', 700);
  s += S.t(xh, 52, ca.name + "'s OC = " + fmt(m.hi), 21, '#0e7fae', 'middle', 700);
  s += S.c(totX(m.p, m), TOT.y, 14, '#dc2626', '#fff');
  svg.innerHTML = s;
}

/* ═══════════════════════════════════════════════════════════════
   6 · PANELS — the two tables, the card footers, the write-up
   ═══════════════════════════════════════════════════════════════ */

/* table 1 — output per day.  abs. is a SUPERSCRIPT, cmp. a SUBSCRIPT, and the
   two share ONE horizontal slot: one box, width from a hidden sizer, both
   markers pinned to the same left edge, one raised, one dropped.  The slot is
   emitted at every step — an unearned marker is just invisible — so the cell's
   width is fixed at step 0 and no column can ever move under the class.
   The OC column carries step 2; step 1 stamps abs., step 3 stamps cmp.      */
function drawTable(m){
  const st = state.step;
  const mk = (k, good) => {
    const isA = (good === 'cloth' ? m.aaCloth : m.aaWine) === k;
    const isC = (good === 'cloth' ? m.caCloth : m.caWine) === k;
    const on  = a => (a ? (st >= 1 && isA) : (st >= 3 && isC));
    return `<span class="mk">`+
           `<span class="sz">cmp.</span>`+
           `<span class="a${on(true)  ? '' : ' off'}">abs.</span>`+
           `<span class="c${on(false) ? '' : ' off'}">cmp.</span>`+
           `</span>`;
  };
  document.getElementById('dtaHead').innerHTML =
    `<tr><th>Country</th><th>Cloth</th><th>Wine</th><th>OC · 1 wine</th></tr>`;

  document.getElementById('dtaBody').innerHTML =
    [['eng', m.cty.eng], ['por', m.cty.por]].map(([k,d])=>{
      const cls = k === 'eng' ? 'cn-e' : 'cn-p';
      const oc = st >= 2 ? fmt(d.oc) : '<span class="pend">·</span>';
      return `<tr><td class="${cls}">${esc(d.name)}</td>`+
             `<td>${fmt(d.C)}${mk(k,'cloth')}</td>`+
             `<td>${fmt(d.W)}${mk(k,'wine')}</td>`+
             `<td>${oc}</td></tr>`;
    }).join('');
}

/* table 2 — ONE table, three column groups: Autarky (4) → Specialise (5) →
   Trade (7).  The step-8 result lives here as two numbers per country instead
   of as a sentence.

   It is laid out in FULL from step 0 — every group, every cell — and a step
   only changes what is IN a cell.  Letting the table appear at step 4 was the
   single biggest layout jump on the page: until then table 1 had the whole
   column to itself, so the moment table 2 arrived table 1's rows went from
   62px to 174px and the whole left column re-drew itself.  Reserving the
   second table's slot up front means neither table ever moves again.       */
function drawTable2(m){
  const st = state.step;
  const GROUPS = [
    { at:4, name:'Autarky',    cls:'g-aut', get:d => d.A  },
    { at:5, name:'Specialise', cls:'g-spe', get:d => d.S  },
    { at:7, name:'Trade',      cls:'g-tra', get:d => d.Ct }
  ];

  /* a group the lesson has not reached keeps the neutral tint and a · in its
     cells — the colour arriving IS the cue that this moment is now on the
     table, and the · is the same pending mark table 1 uses for its OC column */
  const gTop = GROUPS.map((g,i) =>
    `<th class="grp ${g.cls}${st >= g.at ? '' : ' notyet'}${i ? ' g1' : ''}" colspan="2">${g.name}</th>`).join('');
  const gSub = GROUPS.map((g,i) =>
    `<th class="sub${i ? ' g1' : ''}">Cloth</th><th class="sub">Wine</th>`).join('');
  /* a two-level head: the moment across its two columns, the units under it */
  document.getElementById('dta2Head').innerHTML =
    `<tr><th class="lead" rowspan="2"></th>${gTop}</tr><tr>${gSub}</tr>`;

  document.getElementById('dta2Body').innerHTML =
    [['eng', m.cty.eng], ['por', m.cty.por]].map(([k,d])=>{
      const cls = k === 'eng' ? 'cn-e' : 'cn-p';
      const cells = GROUPS.map((g,i)=>{
        const on = st >= g.at;
        const b = g.get(d);
        const cell = n => on ? `<td${i ? ' class="g1"' : ''}>${fmt(n)}</td>`
                             : `<td class="pend${i ? ' g1' : ''}">·</td>`;
        return cell(b.y) + cell(b.x);
      }).join('');
      return `<tr><td class="${cls}">${esc(d.name)}</td>${cells}</tr>`;
    }).join('');
}

function drawFooters(m){
  const st = state.step;
  const put = (ro, bdg, d) => {
    let txt;
    if      (st === 0 || st === 1) txt = `${fmt(d.C)} cloth max · ${fmt(d.W)} wine max`;
    else if (st === 2 || st === 3) txt = `1 wine costs ${fmt(d.oc)} cloth`;
    else if (st === 4)             txt = `autarky · ${fmt(d.A.y)} cloth + ${fmt(d.A.x)} wine`;
    else if (st === 5 || st === 6) txt = `specialise · ${fmt(d.S.y)} cloth + ${fmt(d.S.x)} wine`;
    else                           txt = `consume · ${fmt(d.Ct.y)} cloth + ${fmt(d.Ct.x)} wine`;
    ro.textContent = txt;
    bdg.textContent = ''; bdg.className = 'bdg';
    if (st >= 7){
      bdg.textContent = d.beyond ? 'beyond PPC' : (d.onPpc ? 'on PPC' : 'inside PPC');
      bdg.className = 'bdg ' + (d.beyond ? 'good' : 'bad');
    }
  };
  put(document.getElementById('roE'), document.getElementById('bdgE'), m.cty.eng);
  put(document.getElementById('roP'), document.getElementById('bdgP'), m.cty.por);

  /* comparative-advantage pill on each card header (from step 4 = CA) */
  for (const k of ['eng','por']){
    const el = document.getElementById(k === 'eng' ? 'caE' : 'caP');
    if (st >= 3){
      const goodTxt = (m.caCloth === k) ? 'cloth' : 'wine';
      el.style.display = '';
      el.textContent = 'CA · ' + goodTxt;
      el.style.background = (k === 'eng' ? '#e8f0fe' : '#e7f6ee');
      el.style.color      = (k === 'eng' ? '#1d4ed8' : '#046a4b');
    } else { el.style.display = 'none'; }
  }
}

/* The write-up under the charts.  Almost nothing is left of it: steps 1–5
   say what they have to say in the two tables, and step 8's result is the
   TRADE column group of table 2.  The only thing words are needed for is the
   one question a table cannot answer — is THIS price acceptable to both?

   It is rendered from step 0 even though it stays invisible until step 6:
   the strip's slot is reserved up front, so the two PPC cards above it keep
   one size and one position for the whole lesson.                          */
function drawFindings(m){
  const eps = 1e-9, price = m.p;
  const wa = m.cty[m.wineKey], ca = m.cty[m.clothKey];   // seller of wine / of cloth
  const wOK = price > wa.oc + eps;                       // seller gains above its own OC
  const cOK = price < ca.oc - eps;                       // buyer gains below its own OC
  const why = (d, isWa, ok) => (isWa
    ? (ok ? `sells 1 wine for ${fmt(price)} cloth — more than its own ${fmt(d.oc)}`
          : `1 wine earns only ${fmt(price)} cloth — no more than its own ${fmt(d.oc)}`)
    : (ok ? `buys 1 wine for ${fmt(price)} cloth — less than its own ${fmt(d.oc)}`
          : `1 wine costs ${fmt(price)} cloth — no less than its own ${fmt(d.oc)}`));
  const row = (d, isWa, ok) =>
    `<div class="agr"><span class="an">${esc(d.name)}</span>`+
    `<span class="av ${ok?'ok':'no'}">${ok?'✓ agree':'✗ refuse'}</span>`+
    `<span class="ar">${why(d, isWa, ok)}</span></div>`;
  const both = wOK && cOK;
  /* no heading here — the strip's own header carries "6 · TERMS OF TRADE" */
  document.getElementById('fnds2').innerHTML =
    `<div class="fnd two${both?' hot':''}">`+
    row(wa, true, wOK) + row(ca, false, cOK) +
    `<div class="sum fl mut">` +
    (both ? 'Both agree — the price sits inside the zone.'
          : (wOK || cOK) ? 'One side refuses — no trade at this price.'
                         : 'Neither agrees — no trade at this price.') + `</div></div>`;
}

/* ═══════════════════════════════════════════════════════════════
   7 · RENDER
   ═══════════════════════════════════════════════════════════════ */

function render(){
  const m = model(state.key, state.p);
  const st = state.step;

  document.getElementById('nmE').textContent = m.cty.eng.name;
  document.getElementById('nmP').textContent = m.cty.por.name;
  fitViewBox();
  drawCountry(document.getElementById('svgE'), m, 'eng');
  drawCountry(document.getElementById('svgP'), m, 'por');
  drawTable(m); drawTable2(m); drawFooters(m); drawFindings(m);

  /* the deal strip and the write-up are DRAWN and laid out from step 0 and
     merely revealed at step 6 — see .totcard.pre / .fnds.pre.  Hiding them
     with display:none let .charts take the whole column, so the two PPC cards
     changed size the moment they showed.                                    */
  const showTot = st >= 6;
  for (const id of ['totCard', 'fnds2']){
    const el = document.getElementById(id);
    el.classList.toggle('pre', !showTot);
    el.setAttribute('aria-hidden', showTot ? 'false' : 'true');
  }
  drawTot(m);
  document.getElementById('totHead').innerHTML =
    (st >= 7 ? '7 · Trade' : '6 · Terms of trade') +
    ' · 1 wine = <b>' + state.p.toFixed(1) + '</b> cloth';
  document.getElementById('totVal').textContent = state.p.toFixed(1);

  document.getElementById('stNum').textContent = (st+1) + ' / ' + STEPS.length;
  document.getElementById('stName').textContent = STEPS[st].n;
  const b = document.getElementById('stBtn');
  b.disabled = st >= LAST;
  b.textContent = st >= LAST ? 'Done ✓' : '▸ ' + STEPS[st+1].nb;
}

/* ═══════════════════════════════════════════════════════════════
   8 · EVENTS
   ═══════════════════════════════════════════════════════════════ */

function setP(v){
  const m = model(state.key, state.p);
  state.p = Math.min(m.axis.max, Math.max(m.axis.min, v));
  render();
}
function setStep(k){ state.step = Math.min(LAST, Math.max(0, k)); render(); }
function setScen(k){
  state.key = k;
  const m0 = model(k, 0);
  state.p = Math.round((m0.lo + m0.hi)/2 * 10) / 10;
  document.querySelectorAll('#scenBar button').forEach(b=>b.classList.toggle('on', b.dataset.s === k));
  render();
}

document.getElementById('scenBar').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return; setScen(b.dataset.s);
});
document.getElementById('stBtn').addEventListener('click', ()=>setStep(state.step+1));
document.getElementById('stReset').addEventListener('click', ()=>setStep(0));

/* ═══════════════════════════════════════════════════════════════
   9 · THE ONE CONTROL — the red dot on the terms-of-trade line.
   It is already draggable, so a duplicate <input type=range> below it
   would only be a second way to do the same thing.  Drag it, click
   anywhere on the line, or focus it and use ← →.
   ═══════════════════════════════════════════════════════════════ */
(function(){
  const svg = document.getElementById('totSvg');
  let dragging = false;
  const fromEvent = e => {
    const m = model(state.key, state.p);
    const r = svg.getBoundingClientRect();
    const cx = (e.clientX - r.left) / r.width * TOT.W;
    const x0 = TOT.L, x1 = TOT.W - TOT.R;
    const ratio = Math.max(0, Math.min(1, (cx - x0) / (x1 - x0)));
    const v = m.axis.min + ratio * (m.axis.max - m.axis.min);
    return Math.round(v*10)/10;                 // snap so the read-out is stable
  };
  svg.addEventListener('pointerdown', e=>{
    dragging = true;
    svg.classList.add('grabbing');
    try { svg.setPointerCapture(e.pointerId); } catch(_){}
    try { svg.focus({preventScroll:true}); } catch(_){}
    e.preventDefault(); setP(fromEvent(e));
  });
  svg.addEventListener('pointermove', e=>{ if (dragging) setP(fromEvent(e)); });
  svg.addEventListener('pointerup',   ()=>{ dragging = false; svg.classList.remove('grabbing'); });
  svg.addEventListener('pointercancel',()=>{ dragging = false; svg.classList.remove('grabbing'); });

  svg.addEventListener('keydown', e=>{
    const m = model(state.key, state.p);
    const big = (m.axis.max - m.axis.min) > 6;
    const d = e.shiftKey ? (big ? 1 : 0.5) : (big ? 0.2 : 0.1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown'){
      setP(Math.round((state.p - d)*100)/100); e.preventDefault();
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowUp'){
      setP(Math.round((state.p + d)*100)/100); e.preventDefault();
    } else if (e.key === 'Home'){ setP(m.lo); e.preventDefault(); }
    else if (e.key === 'End'){ setP(m.hi); e.preventDefault(); }
  });
})();

/* expose for the verification harness (top-level const is not on window) */
window.GFT = {
  SCEN:SCEN, STEPS:STEPS, LAST:LAST, model:model, state:state,
  setP:setP, setStep:setStep, setScen:setScen, render:render,
  clipSeg:clipSeg, clipPoly:clipPoly
};

setScen('A');
setStep(0);

/* the canvas follows the card, so a resize has to re-fit and redraw */
let rzT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => { fitViewBox(); render(); }, 90);
});

})();
</script>
