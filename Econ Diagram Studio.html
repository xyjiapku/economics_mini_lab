  if(t2){ closePop(); setTool(t2.dataset.tool2); return; }
});

/* ---------- templates: one per special MARKET, never per curve shape ---------- */
function newMarket(keepTitle){
  var t = keepTitle ? S.title : '';
  var opts = JSON.parse(JSON.stringify(S.opts));
  var step = S.shiftStep;
  S = blankState();
  S.kind = 'market';                       /* this is the market starter, by definition */
  S.title = t; S.opts = opts; S.shiftStep = step;
  S.axes = {xLabel:'Quantity', yLabel:'Price', ticks:false, grid:false};
  var d = addCurve('linear', {role:'D', p:{q0:6, p0:92, q1:84, p1:12}});
  var s = addCurve('linear', {role:'S', p:{q0:12, p0:10, q1:88, p1:82}});
  S.activeD = d.id; S.activeS = s.id;
  lastEq = null;
  syncTitle(); syncKind(); syncRail(); render(); renderInspector(true);
}
/* a frontier starter: same wrapper as newMarket, opposite kind.
   mode is 'outward' | 'straight' | 'inward' | 'growth'. */
function newPPC(mode, axisKey){
  /* starting a frontier throws the market away, so it has to be undoable - unlike
     newMarket(false), which only ever runs at boot or behind an explicit pushUndo */
  pushUndo();
  var t = S.title, opts = JSON.parse(JSON.stringify(S.opts)), step = S.shiftStep;
  S = blankState();
  S.kind = 'ppc';
  S.title = t; S.opts = opts; S.shiftStep = step;
  var pr = axisPresetsFor('ppc').filter(function(p){ return p.x === axisKey; })[0] || axisPresetsFor('ppc')[0];
  S.axes = {xLabel:pr.x, yLabel:pr.y, ticks:true, grid:false};
  var bow = (mode === 'straight') ? PPC_N.straight
          : (mode === 'inward')   ? PPC_N.inward : PPC_N.outward;
  if(mode === 'growth'){
    /* the growth starter is a pair: the frontier, and the frontier moved out */
    var base = addCurve('ppc', {role:'PPC', label:'PPC', color:ROLE_COLOR.PPC,
                                p:{a:56, b:56, n:PPC_N.outward}});
    var out = cloneShift(base, 26, 26);
    out.dash = true;
    base.label = 'PPC'; out.label = 'PPC1';
    S.arrowPair = {a: base.id, b: out.id};
    S.marks.push({id:uid('m'), kind:'text', x:42, y:60, text:'economic growth',
                  size:22, color:ROLE_COLOR.PPC, weight:500});
  } else {
    addCurve('ppc', {role:'PPC', label:'PPC', color:ROLE_COLOR.PPC, p:{a:88, b:88, n:bow}});
  }
  lastEq = null; S.sel = null;
  syncTitle(); syncKind(); syncRail(); render(); renderInspector(true);
}
/* add a copy that stays PARALLEL to the current curve of that side */
function addParallel(role){
  var base = (role==='D') ? curveById(S.activeD) : curveById(S.activeS);
  if(base && isPPC(base)) base = null;          /* a frontier is not a demand or a supply */
  pushUndo();
  var eq = liveEq(), fresh;
  if(base && base.visible){
    if(eq) pushEquilibrium(eq);
    fresh = cloneShift(base, 0, 0);
    if(fresh.shape==='hline') translateCurve(fresh, 0, -8);   /* elastic line slides down */
    else translateCurve(fresh, S.shiftStep, 0);               /* everything else slides right */
    S.arrowPair = {a: base.id, b: fresh.id};
  } else {
    fresh = addCurve('linear', {role: role});
  }
  if(role==='D') S.activeD = fresh.id; else S.activeS = fresh.id;
  lastEq = null;
  select({type:'curve', id:fresh.id});
  toast('Added ' + fresh.label + ' \u2014 parallel to ' + (base ? base.label : role) +
        '. Both equilibria are marked.');
  return fresh;
}
/* move a curve by one step. The first press of a fresh curve creates the parallel copy
   and pins the ORIGINAL equilibrium; later presses just keep moving the same copy, so
   the diagram never accumulates a trail of equilibria. */
/* one "shift" means different things: a PPC grows on both axes at once, while an
   elastic line slides down and everything else slides sideways */
function nudgeCurve(c, dir){
  if(isPPC(c))                growCurve(c, 'both', dir);
  else if(c.shape==='hline')  translateCurve(c, 0, dir*8);
  else                        translateCurve(c, dir*S.shiftStep, 0);
}
/* ---------- growth on one axis or on both ----------
   "More capital goods", "more consumer goods" and "more of everything" are three
   different stories, and a PPC is exactly where that distinction gets taught. */
function growCurve(c, axis, dir){
  var step = S.shiftStep;
  var dq = (axis === 'y') ? 0 : dir*step;      /* the X intercept */
  var dp = (axis === 'x') ? 0 : dir*step;      /* the Y intercept */
  var eq = liveEq();
  var base = c.baseId ? curveById(c.baseId) : null;
  if(base && base.visible){
    translateCurve(c, dq, dp);
    S.arrowPair = {a: base.id, b: c.id};
  } else {
    var fresh = cloneShift(c, 0, 0);
    translateCurve(fresh, dq, dp);
    if(eq) pushEquilibrium(eq);
    S.arrowPair = {a: c.id, b: fresh.id};
    setActiveCurve(fresh);
    select({type:'curve', id: fresh.id});
  }
  lastEq = null;
  render(); renderInspector(true);
  return S.arrowPair.b;
}
function shiftCurveBy(c, dir){
  pushUndo();
  var eq = liveEq();
  var base = c.baseId ? curveById(c.baseId) : null;
  if(base && base.visible){
    nudgeCurve(c, dir);
    S.arrowPair = {a:base.id, b:c.id};
  } else {
    var fresh = cloneShift(c, 0, 0);
    nudgeCurve(fresh, dir);
    if(eq) pushEquilibrium(eq);
    S.arrowPair = {a:c.id, b:fresh.id};
    setActiveCurve(fresh);
    select({type:'curve', id:fresh.id});
  }
  lastEq = null;
  render(); renderInspector(true);
  return S.arrowPair.b;
}
/* ---------- one-click shading: derived, so it follows the curves ---------- */
function regionRing(m){
  if(!m.derive) return m.pts;
  var pr = activePair();
  if(!pr.d || !pr.s) return null;
  var eq = (m.derive.when === 'before') ? S.eqHistory[0] : liveEq();
  if(!eq) return null;
  return surplusRing(m.derive.what, pr.d, pr.s, eq);
}
function shadeSurplus(what, when){
  var pr = activePair();
  if(!pr.d || !pr.s){ toast('This needs both a demand and a supply.'); return; }
  if(when === 'before' && !S.eqHistory.length){
    toast('Shift or copy a curve first \u2014 there is no earlier equilibrium yet.');
    return;
  }
  var chk = surplusRing(what, pr.d, pr.s,
                        (when === 'before' ? S.eqHistory[0] : liveEq()));
  if(!chk || chk.length < 3){ toast('That area cannot be built from these curves.'); return; }
  pushUndo();
  S.marks.push({
    id: uid('m'), kind:'region',
    derive: {what: what, when: when},
    color: (what === 'cs' ? '#3498db' : '#27ae60'),
    opacity: (when === 'before' ? 0.14 : 0.34),
    outline: true
  });
  render(); renderInspector(true);
  toast((what === 'cs' ? 'Consumer' : 'Producer') + ' surplus shaded (' + when + ').');
}
function clearShading(){
  var n = S.marks.filter(function(m){ return m.kind === 'region'; }).length;
  if(!n){ toast('Nothing is shaded.'); return; }
  pushUndo();
  S.marks = S.marks.filter(function(m){ return m.kind !== 'region'; });
  if(S.sel && S.sel.type === 'mark' && !markById(S.sel.id)) S.sel = null;
  render(); renderInspector(true);
  toast('Removed ' + n + ' shaded area' + (n > 1 ? 's' : '') + '.');
}

/* ---------- externality ---------- */
function buildExternality(kind){
  var pr = activePair();
  if(!pr.d || !pr.s) return null;
  var soc;
  if(kind === 'cost'){
    /* a negative production externality puts social cost ABOVE the private supply */
    soc = cloneShift(pr.s, 0, 0);
    soc.label = 'MSC'; soc.color = '#c2255c'; soc.role = 'X'; soc.baseId = null;
    translateCurve(soc, 0, 22);
    S.ext = {kind:'cost', social: soc.id, other: pr.d.id};
  } else {
    /* a positive consumption externality puts social benefit ABOVE the private demand */
    soc = cloneShift(pr.d, 0, 0);
    soc.label = 'MSB'; soc.color = '#c2255c'; soc.role = 'X'; soc.baseId = null;
    translateCurve(soc, 0, 16);
    S.ext = {kind:'benefit', social: soc.id, other: pr.s.id};
  }
  return S.ext;
}
function addExternality(kind){
  if(!activePair().d || !activePair().s){ toast('This needs a private demand and a private supply.'); return; }
  pushUndo();
  buildExternality(kind);
  lastEq = null;
  render(); renderInspector(true);
  toast('Social curve added \u2014 the deadweight loss is shaded automatically.');
}
function clearExternality(){
  if(!S.ext) return;
  pushUndo();
  var gone = S.ext.social;
  S.curves = S.curves.filter(function(c){ return c.id !== gone; });
  S.ext = null;
  if(S.sel && S.sel.id === gone) S.sel = null;
  render(); renderInspector(true);
}
/* copy a curve and immediately set up the before/after: the copy becomes the active
   curve, the old equilibrium is pinned, and the two are linked by the shift arrow */
function duplicateCurve(c){
  pushUndo();
  var eq = liveEq();
  var copy = cloneShift(c, 0, 0);
  /* copying a frontier means "show me growth", not a sideways slide */
  if(isPPC(c)) translateCurve(copy, S.shiftStep, S.shiftStep);
  if(eq) pushEquilibrium(eq);
  S.arrowPair = {a:c.id, b:copy.id};
  setActiveCurve(copy);
  lastEq = null;
  select({type:'curve', id:copy.id});
  renderInspector(true);
  return copy;
}
function baseTemplate(){
  var st = blankState();
  st.kind = S.kind;                 /* a template from the market menu stays a market */
  st.axes = JSON.parse(JSON.stringify(S.axes));
  st.opts = JSON.parse(JSON.stringify(S.opts));
  st.shiftStep = S.shiftStep;
  st.title = S.title;
  return st;
}
function applyTemplate(key){
  var t = TEMPLATES[key];
  if(!t) return;
  /* a frontier starter is not a market variant: it hands over to newPPC() */
  if(t.starter){
    var wasMarket = diagramKind() === 'market';
    newPPC(t.starter, t.axis);
    toast(t.name + ' loaded' + switchNote(wasMarket) + ' Drag anything to adjust.');
    return;
  }
  var changing = (t.kind || 'market') !== diagramKind();
  pushUndo();
  S = baseTemplate();
  S.kind = t.kind || 'market';
  if(t.opts) S.opts = Object.assign(S.opts, t.opts);
  if(t.axes) S.axes = JSON.parse(JSON.stringify(t.axes));
  t.fn();
  lastEq = null;
  syncTitle(); syncKind(); syncRail(); render(); renderInspector(true);
  toast(t.name + ' loaded' + switchNote(changing) + ' Drag anything to adjust.');
}
function switchNote(changed){
  return changed ? (S.kind === 'ppc'
    ? ' \u2014 switched to a production possibility frontier.'
    : ' \u2014 switched to a market diagram.') : '';
}
/* switching the axis pair of a frontier without rebuilding it */
function setPPCAxes(key){
  var pr = axisPresetsFor('ppc').filter(function(p){ return p.x === key; })[0];
  if(!pr) return;
  if(isPPCDiagram()){
    pushUndo();
    S.axes.xLabel = pr.x; S.axes.yLabel = pr.y; S.axes.ticks = true;
    lastEq = null;
    render(); renderInspector(true);
  } else {
    newPPC('outward', key);           /* axis choice doubles as "start a frontier" */
  }
}
function firstEq(d, s){
  var pts = polyInt(sampleCurve(d), sampleCurve(s));
  return pts.length ? pts[0] : null;
}

      buildExternality('cost');
    }
  },
  extBenefit:{
    name:'Externality (consumption)',
    desc:'Social benefit above the private demand',
    axes:{xLabel:'Quantity', yLabel:'Price'},
    fn:function(){
      var d = addCurve('linear',{role:'D', label:'MPB', color:'#1c7ed6',
        p:{q0:6, p0:82, q1:86, p1:14}});
      var s = addCurve('linear',{role:'S', label:'MPC', color:'#e03131',
        p:{q0:10, p0:8, q1:84, p1:70}});
      S.activeD = d.id; S.activeS = s.id;
      buildExternality('benefit');
    }

  /* ---------- production possibility ----------
     These three are NOT market variants and they do not live in the market menu.
     `starter` hands the whole build over to newPPC(), so there is exactly one
     implementation behind both the PPC menu and applyTemplate(). */

    kind:'ppc', starter:'outward', axis:'Good X'

    name:'Straight frontier',
    desc:'Straight \u2014 constant cost',
    kind:'ppc', starter:'straight', axis:'Good X'

/* ---------- header wiring ---------- */
function syncTitle(){ document.getElementById('docTitle').value = S.title || ''; }
/* The header says out loud which kind of chart you are looking at, and the rail
   only offers the tools that belong to it. Showing Demand / Supply on a frontier
   (or a Shade button that only knows about consumer surplus) is exactly the
   mixing that makes a PPC look like a funny sort of market. */
function syncKind(){
  var sub = document.getElementById('brandSub');
  var ppc = isPPCDiagram();
  /* kept short on purpose: this sits in the header next to six buttons, and the
     marked header button already says which chart you are in */
  if(sub) sub.textContent = ppc ? 'PPC frontier' : 'D & S market';
  var bt = document.getElementById('btnTemplates'), bp = document.getElementById('btnPPC');
  if(bt) bt.classList.toggle('here', !ppc);
  if(bp) bp.classList.toggle('here', ppc);
}
function syncRail(){
  var kind = diagramKind();
  var els = document.querySelectorAll('#rail [data-for]');
  for(var i=0;i<els.length;i++){
    var want = els[i].dataset.for;
    var show = (want === 'both') || (want === kind);
    els[i].hidden = !show;
  }
  /* a divider with nothing above OR below it would leave a stray rule */
  var rail = document.getElementById('rail');
  var kids = rail.children;
  for(var k=0;k<kids.length;k++){
    if(!kids[k].classList.contains('railsep')) continue;
    var beforeTool = false, afterTool = false;
    for(var a=k-1;a>=0;a--){
      if(kids[a].classList.contains('railsep')) continue;
      if(!kids[a].hidden){ beforeTool = kids[a].classList.contains('tool'); }
      break;
    }
    for(var b2=k+1;b2<kids.length;b2++){
      if(kids[b2].classList.contains('railsep')) continue;
      if(!kids[b2].hidden){ afterTool = kids[b2].classList.contains('tool'); }
      break;
    }
    kids[k].hidden = !(beforeTool && afterTool);
  }
  refreshHint();
}
function bindHeader(){
  document.getElementById('docTitle').addEventListener('input', function(ev){ S.title = ev.target.value; });
  document.getElementById('btnGuide').addEventListener('click', function(ev){
    ev.stopPropagation();
    closePop();
    startTour(0);
  });
  document.getElementById('btnUndo').addEventListener('click', doUndo);
  document.getElementById('btnRedo').addEventListener('click', doRedo);
  document.getElementById('btnExportPng').addEventListener('click', function(ev){
    ev.stopPropagation();
    if(popoverEl && popoverEl.querySelector('[data-do]')){ closePop(); return; }
    openPop(exportMenu(), ev.currentTarget, 400);
  });
  document.getElementById('btnTemplates').addEventListener('click', function(ev){
    ev.stopPropagation();
    if(popoverEl && popoverEl.querySelector('[data-tpl]')){ closePop(); return; }
    openPop(templateMenu(), ev.currentTarget, 476);
  });
  document.getElementById('btnPPC').addEventListener('click', function(ev){
    ev.stopPropagation();
    if(popoverEl && popoverEl.querySelector('[data-ppcaxis]')){ closePop(); return; }
    openPop(ppcMenu(), ev.currentTarget, 400);
  });
  var bs = document.querySelectorAll('.tool');
  for(var i=0;i<bs.length;i++){
    (function(btn){
      btn.addEventListener('click', function(ev){
        ev.stopPropagation();
        var t = btn.dataset.tool;
        closePop();
        if(t==='addD'){ addParallel('D'); return; }
        if(t==='addS'){ addParallel('S'); return; }
        if(t==='more'){ openPop(moreMenu(), btn, 340); return; }
        setTool(t);
      });
    })(bs[i]);
  }
  document.addEventListener('keydown', onKey);
}
function onKey(ev){
  var inField = /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName);
  if(ev.key==='Escape'){
    if(tourIdx >= 0){ endTour(); return; }
    if(pending){ pending = null; render(); return; }
    if(popoverEl){ closePop(); return; }
    if(inField){ ev.target.blur(); return; }
    S.sel = null; render(); renderInspector(true); return;
  }
  if(inField) return;
  if(ev.key==='Enter' && pending && pending.type==='region'){ finishRegion(); return; }
  if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==='z'){
    ev.preventDefault();
    if(ev.shiftKey) doRedo(); else doUndo();
    return;
  }
  if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==='y'){ ev.preventDefault(); doRedo(); return; }
  if(ev.key==='Delete' || ev.key==='Backspace'){
    ev.preventDefault();
    if(S.sel){
      if(S.sel.type==='curve'){ var c = curveById(S.sel.id); if(c) removeCurve(c); }
      else { var m = markById(S.sel.id); if(m) removeMark(m); }
    }
    return;
  }
  var sel = (S.sel && S.sel.type==='curve') ? curveById(S.sel.id) : null;
  if(sel && ev.key.indexOf('Arrow')===0){
    ev.preventDefault();
    var step = ev.shiftKey ? 1 : 0.5;
    pushUndo();
    if(ev.key==='ArrowLeft')  translateCurve(sel, -step, 0);
    if(ev.key==='ArrowRight') translateCurve(sel,  step, 0);
    if(ev.key==='ArrowUp')    translateCurve(sel, 0, -step);
    if(ev.key==='ArrowDown')  translateCurve(sel, 0,  step);
    render(); return;
  }
  var k = ev.key.toLowerCase();
  if(k==='d'){ pushUndo(); select({type:'curve', id:addCurve('linear',{role:'D'}).id}); }
  else if(k==='s'){ pushUndo(); select({type:'curve', id:addCurve('linear',{role:'S'}).id}); }
  else if(k==='v'){ setTool('select'); }
  else if(k==='e'){ setTool('erase'); }
  else if(k==='p'){ setTool('point'); }
  else if(k==='t'){ setTool('text'); }
}

/* ---------- test surface + boot ---------- */
/* =====================================================================
   guided tour - skippable, replayable from the Guide button
   ===================================================================== */
var TOUR_KEY = 'econDiagramStudio.tourDone';
var TOUR = [
  {title:'Welcome', sel:null,
   body:'A plain <b>Demand &amp; Supply</b> diagram is already on the canvas. '+
        'Six quick steps \u2014 you can skip at any point, and replay it later from <b>Guide</b>.'},
  {title:'The canvas', sel:'#stage',
   body:'Drag a curve to move it, drag the round handles to change its shape. '+
        'Drag any letter \u2014 <b>D</b>, <b>S</b>, <b>E\u2081</b>, <b>P\u2081</b> \u2014 to park that label exactly where you want it.'},
  {title:'Show a change', sel:'[data-tool="addD"]',
   body:'<b>Demand</b> adds a curve parallel to the current one. The old equilibrium stays pinned, '+
        'and <b>P\u2081 P\u2082 / Q\u2081 Q\u2082</b> are written straight onto the axes.'},
  {title:'Special markets', sel:'#btnTemplates',
   body:'AD\u2013AS, both reserve-market regimes and the externality diagrams live here. '+
        'Each one has a little picture, so you can see what you are picking.'},
  {title:'Shade a surplus', sel:'[data-tool="region"]',
   body:'One click for <b>consumer</b> and <b>producer surplus</b>, at the old equilibrium and at the new one. '+
        'The areas are worked out from the curves, so they stay correct when you drag one.'},
  {title:'Everything about one curve', sel:'#inspector',
   body:'Select a curve and this panel is about that curve only \u2014 its type, its <b>Angle</b>, its colour. '+
        'Axis names for the labour, money, loanable-funds and foreign-exchange markets are under <b>Axes</b>.'},
  {title:'Getting it out', sel:'#btnExportPng',
   body:'Export a PNG up to 4\u00d7, copy it straight into PowerPoint, or save an editable SVG.'}
];
var tourIdx = -1, tourLit = null, tourCard = null, tourBlock = null;

function endTour(){
  if(tourLit) tourLit.classList.remove('tour-lit');
  if(tourBlock && tourBlock.parentNode) tourBlock.parentNode.removeChild(tourBlock);
  if(tourCard && tourCard.parentNode) tourCard.parentNode.removeChild(tourCard);
  tourLit = null; tourCard = null; tourBlock = null; tourIdx = -1;
  try { window.localStorage.setItem(TOUR_KEY, '1'); } catch(e){}
}
function tourAt(i){
  var step = TOUR[i], el = step.sel ? document.querySelector(step.sel) : null;
  if(tourLit) tourLit.classList.remove('tour-lit');
  if(tourCard && tourCard.parentNode) tourCard.parentNode.removeChild(tourCard);
  if(tourBlock && tourBlock.parentNode) tourBlock.parentNode.removeChild(tourBlock);
  tourLit = el;
  if(el) el.classList.add('tour-lit');
  if(!tourBlock){
    tourBlock = document.createElement('div');
    tourBlock.id = 'tourBlock';
    document.body.appendChild(tourBlock);
  }
  tourCard = document.createElement('div');
  tourCard.id = 'tourCard';
  tourCard.innerHTML =
    '<h4>' + step.title + '<span>' + (i+1) + ' / ' + TOUR.length + '</span></h4>' +
    '<p>' + step.body + '</p>' +
    '<div class="tf"><div class="dots">' +
      TOUR.map(function(_, k){ return '<i class="' + (k === i ? 'on' : '') + '"></i>'; }).join('') +
    '</div>' +
      (i > 0 ? '<button data-tour="back">Back</button>' : '') +
      '<button data-tour="skip">Skip</button>' +
      '<button class="primary" data-tour="' + (i === TOUR.length-1 ? 'done' : 'next') + '">' +
        (i === TOUR.length-1 ? 'Start drawing' : 'Next') + '</button>' +
    '</div>';
  document.body.appendChild(tourCard);
  tourPlace(el);
}
function tourPlace(el){
  if(!tourCard) return;
  var W = window.innerWidth, H = window.innerHeight, m = 16;
  var r = el ? el.getBoundingClientRect() : null;
  var w = tourCard.offsetWidth || 336, h = tourCard.offsetHeight || 190;
  var cx = r ? r.left + r.width/2 : W/2;
  var left = clamp(cx - w/2, m, W - w - m);
  var top;
  if(!r) top = (H - h)/2;
  else if(r.top + r.height/2 < H/2) top = Math.min(r.bottom + 14, H - h - m);
  else top = Math.max(r.top - h - 14, m);
  tourCard.style.left = Math.round(left) + 'px';
  tourCard.style.top  = Math.round(top) + 'px';
}
function startTour(i){
  tourIdx = (i == null) ? 0 : i;
  tourAt(tourIdx);
}
function tourStep(d){
  var n = tourIdx + d;
  if(n < 0) n = 0;
  if(n >= TOUR.length){ endTour(); return; }
  tourIdx = n;
  tourAt(tourIdx);
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('[data-tour]') : null;
  if(!b) return;
  ev.preventDefault(); ev.stopPropagation();
  var a = b.dataset.tour;
  if(a === 'skip' || a === 'done') endTour();
  else if(a === 'next') tourStep(1);
  else if(a === 'back') tourStep(-1);
}, true);
window.addEventListener('resize', function(){ if(tourCard) tourPlace(tourLit); });

window.addEventListener('beforeunload', function(){ if(draftTimer){ clearTimeout(draftTimer); draftTimer = null; } saveDraft(); });

setTool('select');
(function restoreDraft(){
  if(draftsOff()) return;
  var d = loadDraft();
  if(!d) return;
  var st;
  try{ st = adoptState(d); }catch(e){ clearDraft(); return; }
  if(!st.curves.length && !st.marks.length) return;
  S = st; lastEq = null;
  syncTitle(); syncKind(); syncRail(); render(); renderInspector(true);
  toast('Picked up where you left off \u2014 Markets \u25b8 Plain Demand & Supply starts fresh.');
})();
/* show the tour once; if storage is blocked we simply never nag */
(function(){
  var seen = true;
  try { seen = !!window.localStorage.getItem(TOUR_KEY); } catch(e){ seen = true; }
  if(!seen) setTimeout(function(){ if(tourIdx < 0) startTour(0); }, 400);
})();
