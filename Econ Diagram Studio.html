<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Econ Diagram Studio — Demand &amp; Supply Diagram Builder</title>
<style>
:root{
  --bg:#f2f1ec; --stage:#dedcd4; --panel:#ffffff; --panel2:#f7f6f3; --rail:#f6f7fa;
  --line:#dedbd2; --line2:#c7c4b9;
  --text:#121211; --muted:#4b4943; --muted2:#6b6862;
  --accent:#1971c2; --accent-bg:#e7f5ff; --accent-line:#a5d8ff;
  --c-demand:#1c7ed6; --c-supply:#e03131; --c-shade:#0b7285; --c-danger:#c92a2a;
  --c-macro:#f08c00; --c-axis:#1971c2; --c-pair:#7048e8; --c-eq:#2f9e44;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:19.5px; overflow:hidden}
#app{display:grid;grid-template-rows:68px 1fr 36px;height:100%}

header{display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--panel);border-bottom:2px solid var(--accent-line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:21px;white-space:nowrap}
.brand svg{flex:0 0 auto;display:block}
.brand span{color:var(--muted);font-weight:400;font-size:18px;margin-left:3px}
/* six header buttons plus the wordmark no longer fit a 1280 window, so the kind
   label is the first thing to go - the marked header button still shows the type */
@media (max-width:1439px){ .brand span{display:none} }
/* a fixed 250px title box plus six header buttons no longer fits a 1280 window,
   so the title gives way first (the .spacer collapses before this does) */
header input#docTitle{flex:0 1 250px;min-width:80px;height:38px;border:1px solid transparent;border-radius:8px;
  padding:0 11px;font-size:19.5px;background:transparent;color:var(--text);font-family:inherit}
/* the header button for the diagram you are looking at is marked, so "which chart
   am I in" is answered at a glance and the two starters never look equivalent */
header button.here{background:var(--accent-bg);color:var(--accent);font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--accent)}
header button.here svg{color:var(--accent)}
/* shown at the top of a menu that would replace the diagram with the other kind */
.switchbar{margin:2px 8px 9px;padding:7px 10px;border-radius:8px;font-size:17.25px;
  background:#fff4e0;color:#8a6410;line-height:1.4}
header input#docTitle:hover{border-color:var(--line2)}
header input#docTitle:focus{outline:none;border-color:var(--accent-line);background:#fff}
.spacer{flex:1}
button{font-family:inherit;font-size:18px;font-weight:500;color:var(--text);background:#fff;
  border:1px solid var(--line2);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
button:hover{background:var(--panel2);border-color:#a8a59a}
button:active{background:#f0efeb}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:700}
button.primary:hover{background:#d0ebff}
button svg{width:20px;height:20px;flex:0 0 auto;display:block}
button .g2{color:var(--ic,currentColor)}
button.wide{width:100%;display:flex}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
/* three abreast in a 344px panel: the default button padding would overflow */
.seg.tight button{padding-left:4px;padding-right:4px}

main{display:grid;grid-template-columns:104px 1fr 344px;min-height:0}

#rail{background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:10px 7px}
.tool{height:68px;border-radius:11px;border:1px solid transparent;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:15.75px;font-weight:600;color:var(--text);cursor:pointer;gap:4px;padding:0;position:relative;
  transition:background .12s,color .12s,border-color .12s}
.tool:hover{background:#eef0f5;border-color:var(--line);color:var(--text)}
.tool.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:700}
.tool.on::before{content:'';position:absolute;left:-7px;top:12px;bottom:12px;width:4px;
  border-radius:0 3px 3px 0;background:var(--accent)}
.tool svg{width:27px;height:27px;flex:0 0 auto;display:block;color:var(--ic,var(--muted));
  transition:color .12s}
.tool:hover svg{color:var(--ic,var(--text))}
.tool.on svg{color:var(--ic,var(--accent))}
.railsep{height:1px;background:var(--line);margin:6px 6px}
/* ⚠️ the UA sheet's [hidden]{display:none} loses to .tool{display:flex}, so a
   "hidden" rail button would keep its 68px slot and stretch the whole rail.
   The type-aware rail depends on this rule actually hiding things. */
#rail > [hidden]{display:none}

#stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;
  justify-content:center;padding:16px;background:var(--stage);overflow:hidden}
#canvas{width:100%;height:100%;background:#fff;border:1px solid #dedcd4;
  border-radius:14px;box-shadow:0 4px 16px rgba(28,36,44,.08),0 1px 3px rgba(28,36,44,.05)}
#canvas text{user-select:none}
/* ---------- hover hints ----------
   The invisible grab shapes carry their paint as presentation attributes, and a
   CSS rule beats those, so the whole effect is possible with no JS at all.
   Rule of thumb: only ever GROW the hit geometry. Shrinking it under the cursor
   makes the element unhover itself and flicker, so the wide grab bands are
   tinted and their width is deliberately left alone. */
#canvas [data-lbl]:hover,
#canvas rect[data-mark]:hover,
#canvas circle[data-mark]:hover{
  fill:rgba(25,113,194,.14);stroke:rgba(25,113,194,.6);
  stroke-width:1.3;stroke-dasharray:6 4}
#canvas [data-hit]:hover,
#canvas path[data-mark]:hover,
#canvas polygon[data-mark]:hover{
  stroke:rgba(25,113,194,.22);stroke-dasharray:none}
/* a handle already has a coloured rim, so a colour change alone is invisible -
   tint its face and thicken the rim instead (both of which GROW the target) */
#canvas [data-handle]:hover{fill:rgba(25,113,194,.22);stroke:#0b4f8a;stroke-width:3.2}
/* the inline rename box that opens on a double click */
.inlineEdit{position:absolute;z-index:60;background:#fff;color:var(--text);
  border:2px solid var(--accent);border-radius:7px;padding:2px 8px;font-family:inherit;
  font-weight:700;outline:none;box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:64px}

.pop{position:absolute;z-index:40;background:#fff;border:1px solid var(--line2);
  border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.14);padding:8px;min-width:330px;
  max-height:calc(100% - 24px);overflow-y:auto}
.pop h4{margin:3px 8px 8px;font-size:15.75px;font-weight:600;color:var(--muted2);
  text-transform:uppercase;letter-spacing:.6px}
.popitem{display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:9px;cursor:pointer}
.popitem.on{background:var(--accent-bg);box-shadow:inset 0 0 0 1.5px var(--accent)}
.popitem.on b{color:var(--accent)}
.popitem:hover{background:var(--panel2)}
.popitem .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.popitem b{font-size:18.75px;font-weight:500}
.popitem i{font-size:16.5px;color:var(--muted);font-style:normal}
.popitem .thumb{flex:0 0 auto;border-radius:8px;background:#fbfaf8;border:1px solid var(--line)}
.popsep{height:1px;background:var(--line);margin:7px 5px}
.poprow{display:flex;align-items:center;gap:11px;padding:7px 12px;font-size:18px;color:var(--muted)}
.poprow .seg{flex:1}
.poprow .seg button{padding:6px 0;flex:1;font-size:17.25px}
.poprow .seg button.on{background:var(--accent-bg);border-color:var(--accent-line);
  color:var(--accent);font-weight:600}

#inspector{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;
  padding:15px 15px 32px}
#inspector::-webkit-scrollbar{width:11px}
#inspector::-webkit-scrollbar-thumb{background:#d5d3ca;border-radius:6px}
.sec{margin-bottom:21px}
.sec>h3{margin:0 0 12px;font-size:15.75px;font-weight:800;color:var(--text);
  text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:9px}
.sec>h3::before{content:'';width:5px;height:20px;border-radius:2px;flex:0 0 auto;
  background:var(--bar,var(--accent))}
.sec>h3 em{font-style:normal;font-weight:600;color:var(--muted);text-transform:none;
  letter-spacing:0;font-size:16.5px;margin-left:auto}
.row{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.row>label{flex:0 0 88px;font-size:17.25px;color:var(--muted)}
.row input[type=text],.row input[type=number],.row select{flex:1;min-width:0;height:37px;
  border:1px solid var(--line2);border-radius:8px;padding:0 10px;font-family:inherit;
  font-size:18px;color:var(--text);background:#fff}
.row input:focus,.row select:focus{outline:none;border-color:var(--accent-line)}
/* min-width:0 matters: without it a range input keeps its ~129px intrinsic width
   and pushes everything after it out of the panel */
.row input[type=range]{flex:1 1 0;min-width:0;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--text);
  padding:6px 0;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:20px;height:20px;cursor:pointer}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.sw b{height:34px;border-radius:8px;cursor:pointer;position:relative;
  background:#fff;border:1px solid var(--line2)}
.sw b::after{content:'';position:absolute;left:7px;right:7px;top:50%;margin-top:-2px;
  height:4px;border-radius:2px;background:currentColor}
.sw b:hover{border-color:#a9a69b}
.sw b.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.empty{font-size:18px;color:var(--muted);line-height:1.6}
.hint{font-size:17.25px;color:var(--muted);line-height:1.55;background:var(--accent-bg);
  border:1px solid var(--accent-line);border-radius:9px;padding:9px 12px;margin-top:11px}
.hint b{font-weight:700;color:var(--accent)}
.sub{font-size:17.25px;color:var(--muted);margin:-2px 0 11px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:11px;font-size:17.25px;padding:5px 0;color:var(--muted)}
.kv b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row .num{flex:0 0 66px;text-align:right;font-variant-numeric:tabular-nums;font-size:18px;
  font-weight:600;color:var(--accent)}
details.more{border-top:1px solid var(--line);padding-top:6px;margin-bottom:21px}
details.more>summary{font-size:15.75px;font-weight:800;color:var(--text);
  text-transform:uppercase;letter-spacing:.7px;cursor:pointer;list-style:none;
  padding:7px 0 7px 12px;outline:none;border-left:5px solid var(--bar,var(--line2));
  border-radius:0 4px 4px 0}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'\25B8';display:inline-block;width:18px;color:var(--bar,var(--muted))}
details.more[open]>summary::before{content:'\25BE'}
details.more[open]>summary{background:var(--panel2)}
details.more>summary:hover{color:var(--accent)}

footer{display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--panel2);
  border-top:1px solid var(--line);font-size:17.25px;color:var(--muted)}
footer .spacer{flex:1}
footer #credit{color:var(--muted2)}
footer .st{font-variant-numeric:tabular-nums}
footer #stEq{color:var(--accent);font-weight:600}

#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(8px);
  background:#2b2b28;color:#fff;padding:11px 18px;border-radius:10px;font-size:18.75px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:99;max-width:70vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- guided tour ---------- */
#tourBlock{position:fixed;inset:0;z-index:215}
.tour-lit{position:relative;z-index:210;border-radius:9px;
  box-shadow:0 0 0 3px var(--accent),0 0 0 9999px rgba(14,14,12,.55)}
#tourCard{position:fixed;z-index:220;width:470px;background:#fff;border-radius:15px;
  box-shadow:0 16px 48px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.15);
  padding:20px 22px 18px;border-top:5px solid var(--accent)}
#tourCard h4{margin:0 0 10px;font-size:21.75px;font-weight:800;color:var(--text);
  display:flex;align-items:baseline;gap:10px}
#tourCard h4 span{margin-left:auto;font-size:16.5px;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums}
#tourCard p{margin:0 0 18px;font-size:18.75px;line-height:1.62;color:var(--muted)}
#tourCard b{color:var(--text);font-weight:700}
#tourCard .tf{display:flex;align-items:center;gap:10px}
#tourCard .dots{display:flex;gap:5px;flex:1}
#tourCard .dots i{width:8px;height:8px;border-radius:50%;background:var(--line2);display:block;
  transition:width .15s,background .15s}
#tourCard .dots i.on{background:var(--accent);width:22px;border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 22 22" width="30" height="30" fill="none" stroke-linecap="round">
        <path d="M3.2 3 V19 H19.6" stroke="#93a2ad" stroke-width="1.9"/>
        <path d="M6.2 7.2 L12 15.8" stroke="#1c7ed6" stroke-width="2.4"/>
        <path d="M7.2 15.8 L13 7.2" stroke="#e03131" stroke-width="2.4"/>
      </svg>
      Econ Diagram Studio<span id="brandSub">Demand &amp; supply market</span>
    </div>
    <input id="docTitle" type="text" placeholder="Untitled diagram" spellcheck="false">
    <div class="spacer"></div>
    <button id="btnUndo" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 5.5 H12 A4.4 4.4 0 0 1 12 14.3 H6"/>
        <path d="M10 2.5 L7 5.5 L10 8.5"/></svg>
      Undo</button>
    <button id="btnRedo" title="Redo (Ctrl+Shift+Z)">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.5 5.5 H8 A4.4 4.4 0 0 0 8 14.3 H14"/>
        <path d="M10 2.5 L13 5.5 L10 8.5"/></svg>
      Redo</button>
    <button id="btnGuide" title="Show the guided tour">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="10" cy="10" r="7.4"/>
        <path d="M7.9 7.7 A2.2 2.2 0 1 1 10 10.7 V12"/>
        <circle cx="10" cy="14.8" r="0.9" fill="currentColor" stroke="none"/></svg>
      Guide</button>
    <button id="btnTemplates" title="Start a market diagram">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 3.5 V16.5 H16.5"/>
        <path d="M5.5 13 L8.5 9.5 L11 12 L15 6.5"/></svg>
      Markets</button>
    <button id="btnPPC" title="Start a production possibility diagram">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16.5 V3.5"/><path d="M4 16.5 H17"/>
        <path d="M5.5 5 Q12.5 5.6 16 15.5"/></svg>
      PPC</button>
    <button id="btnExportPng" class="primary" title="Export an image">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 3 V12.5"/><path d="M6.3 9.2 L10 13 L13.7 9.2"/>
        <path d="M4 15.5 H16"/></svg>
      Export</button>
  </header>
  <main>
    <aside id="rail">
      <button class="tool on" data-for="both" data-tool="select" title="Select and reshape curves">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M6 3 L6 15.5 L9.2 12.4 L11.3 16.6 L13.1 15.7 L11 11.6 L15.2 11.4 Z" fill="currentColor" stroke-width="1.1"/></svg>
        Select</button>
      <div class="railsep" data-for="both"></div>
      <button class="tool" data-for="market" data-tool="addD" style="--ic:var(--c-demand)" title="Add a Demand parallel to the current one">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3.5 2.5 V15.5 H17"/><path d="M5 5.5 L12 12"/><path d="M16 3.2 V7.2 M14 5.2 H18"/></svg>
        Demand</button>
      <button class="tool" data-for="market" data-tool="addS" style="--ic:var(--c-supply)" title="Add a Supply parallel to the current one">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3.5 2.5 V15.5 H17"/><path d="M5 12 L12 5.5"/><path d="M16 3.2 V7.2 M14 5.2 H18"/></svg>
        Supply</button>
      <div class="railsep" data-for="market"></div>
      <button class="tool" data-for="ppc" data-tool="point" style="--ic:#c92a2a" title="Mark a point: on the frontier, inside it, or outside it">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3.5 2.5 V15.5 H17"/><circle cx="10.5" cy="8" r="2.4" fill="currentColor" stroke="none"/></svg>
        Point</button>
      <button class="tool" data-for="ppc" data-tool="arrow" style="--ic:#0b7280" title="Draw an arrow: growth, or the move along the frontier">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 15.5 L16 3"/><path d="M11 3 H16 V8"/></svg>
        Arrow</button>
      <div class="railsep" data-for="ppc"></div>
      <button class="tool" data-for="both" data-tool="text" style="--ic:#0b7285" title="Add a text label">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M4.5 4.5 H15.5"/><path d="M10 4.5 V15.5"/></svg>
        Text</button>
      <button class="tool" data-for="market" data-tool="region" style="--ic:var(--c-shade)" title="Shade a surplus area">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M3.5 3.5 H16.5 V16.5 H3.5 Z"/><path d="M3.5 16.5 L16.5 3.5"/>
          <path d="M3.5 10.5 V16.5 H9.5 Z" fill="currentColor" opacity=".38" stroke="none"/></svg>
        Shade</button>
      <button class="tool" data-for="both" data-tool="more" title="More tools">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <circle cx="5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15" cy="10" r="1.6"/></svg>
        More</button>
      <div class="railsep" data-for="both"></div>
      <button class="tool" data-for="both" data-tool="erase" style="--ic:var(--c-danger)" title="Delete a curve, point or label">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M4 6 H16"/><path d="M7.5 6 V16 H12.5 V6"/><path d="M8 3.5 H12"/></svg>
        Erase</button>
    </aside>
    <section id="stage">
      <svg id="canvas" viewBox="0 0 960 720" preserveAspectRatio="xMidYMid meet"
           xmlns="http://www.w3.org/2000/svg"></svg>
    </section>
    <aside id="inspector"></aside>
  </main>
  <footer>
    <span id="stHint">Ready.</span>
    <span class="spacer"></span>
    <span class="st" id="stEq"></span>
    <span class="st" id="stCoords"></span>
    <span id="credit">&copy; 2026 Dr. Jia</span>
  </footer>
</div>
<div id="toast"></div>
<input type="file" id="fileOpen" accept=".json,application/json" hidden>

<script>
'use strict';
(function(){

var VB = {w:960, h:720};
var PAD = {l:104, r:64, t:56, b:106};
var PLOT = {x0:PAD.l, x1:VB.w-PAD.r, y0:PAD.t, y1:VB.h-PAD.b};
var CW = PLOT.x1-PLOT.x0, CH = PLOT.y1-PLOT.y0;
var OFF = 34;

function X(q){ return PLOT.x0 + (q/100)*CW; }
function Y(p){ return PLOT.y1 - (p/100)*CH; }
function invX(x){ return (x-PLOT.x0)/CW*100; }
function invY(y){ return (PLOT.y1-y)/CH*100; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function r2(v){ return Math.round(v*100)/100; }

var FONT = "'Segoe UI',system-ui,-apple-system,'Microsoft YaHei',sans-serif";
var PALETTE = ['#1c7ed6','#e03131','#7048e8','#f08c00','#2f9e44','#0c8599','#495057','#c2255c'];
var ROLE_COLOR = {D:'#1c7ed6', S:'#e03131', AD:'#f08c00', AS:'#e03131', LRAS:'#2f9e44',
                  PPC:'#7048e8', X:'#495057'};
var ROLE_NAME = {D:'Demand', S:'Supply', AD:'Aggregate demand', AS:'Aggregate supply',

/* ---------- sampling ---------- */
function catmullRom(pts, seg){
  if(!pts || pts.length<2) return (pts||[]).slice();
  var P = [pts[0]].concat(pts, [pts[pts.length-1]]), out = [];
  for(var i=1;i<P.length-2;i++){
    var p0=P[i-1], p1=P[i], p2=P[i+1], p3=P[i+2];
    for(var j=0;j<seg;j++){
      var t=j/seg, t2=t*t, t3=t2*t;
      out.push({
        x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
      });
    }
  }
  out.push(P[P.length-2]);
  return out;
}
function sampleCurve(c){
  var p = c.p, i, out, n, q, tt, qa, qb;
  switch(c.shape){
    case 'linear': return [{x:p.q0,y:p.p0},{x:p.q1,y:p.p1}];
    case 'hline':  return [{x:p.q0,y:p.p},{x:p.q1,y:p.p}];
    case 'vline':  return [{x:p.q,y:p.p0},{x:p.q,y:p.p1}];
    case 'kink':   return [{x:p.q0,y:p.p0},{x:p.qk,y:p.pk},{x:p.q1,y:p.p1}];
    case 'kink3':  return [{x:p.q0,y:p.pA},{x:p.q1,y:p.pA},{x:p.q2,y:p.pB},{x:p.q3,y:p.pB}];
    case 'hyperbola':
      out=[]; n=170; qa=Math.max(1,p.q0); qb=Math.max(qa+1,p.q1);
      for(i=0;i<=n;i++){ q = qa + (qb-qa)*i/n; out.push({x:q, y:p.k/q}); }
      return out;
    case 'kinkedAS':
      out=[{x:0,y:p.p0},{x:p.q1,y:p.p0}]; n=150;
      for(i=1;i<=n;i++){
        tt=i/n;
        out.push({x:p.q1+(p.q2-p.q1)*tt, y:p.p0+(p.p2-p.p0)*Math.pow(tt,p.gamma)});
      }
      out.push({x:p.q2,y:p.pMax});
      return out;
    /* the PPC runs from the Y intercept (0,b) down to the X intercept (a,0),
       bowed away from the origin. Sampled from the implicit superellipse so the
       curvature handle can retune `n` and the shape stays exact. */
    case 'ppc':
      out=[]; n=170;
      /* n below 1 is allowed on purpose - that is the inward-bowed variant */
      qa = Math.max(6, p.a || 90); tt = clamp(p.n || PPC_N.outward, 0.3, 9);
      qb = Math.max(6, p.b || 90);
      for(i=0;i<=n;i++){
        q = i/n;
        out.push({x: q*qa,
                  y: qb * Math.pow(Math.max(0, 1 - Math.pow(q, tt)), 1/tt)});
      }
      return out;
    case 'smooth': return catmullRom(p.pts, 26);
  }
  return [];
}
/* how hard a PPC bows, as the y reached at half of the X intercept. Inverted by
   the curvature handle so dragging that handle feels like bending the curve. */
/* ---------- PPC bow ----------
   Signed bow: how far the midpoint sits above the straight chord, as a fraction of
   the Y intercept. 0 = straight, positive = outward, negative = inward. Symmetric
   enough that the slider reads the same either side of zero. */
function ppcBow(p){
  var n = clamp(p.n || PPC_N.outward, 0.3, 9);
  return Math.pow(1 - Math.pow(0.5, n), 1/n) - 0.5;
}
/* invert it by bisection in log space, because n spans 0.3 ... 9 */
function ppcBowToN(bow){
  var target = clamp(0.5 + (bow || 0), 0.02, 0.9955);
  var lo = 0.3, hi = 9, i, mid, v;
  for(i=0;i<48;i++){
    mid = Math.sqrt(lo*hi);
    v = Math.pow(1 - Math.pow(0.5, mid), 1/mid);
    if(v < target) lo = mid; else hi = mid;
  }
  return Math.round(((lo+hi)/2)*1000)/1000;
}
/* which opportunity-cost story the curve is telling */
function ppcRegime(p){
  var b = ppcBow(p);
  if(b > 0.04) return 'rises';
  if(b < -0.04) return 'falls';
  return 'flat';
}
/* what each shape means, in opportunity-cost language - the only reason a PPC is

var PPC_REGIME_NOTE = {
  rises:'Bowed outward \u2014 moving right costs ever more of the other good, '+
        'so the opportunity cost rises. The standard case.',
  flat: 'Straight \u2014 constant opportunity cost all the way along the frontier, '+
        'so each extra unit of one good costs the same amount of the other.',
  falls:'Bowed inward \u2014 moving right costs less and less of the other good, so the '+
        'opportunity cost falls. Rare, but the contrast makes the standard case stick.'
};
function isPPC(c){ return !!c && (c.shape==='ppc' || c.role==='PPC'); }
function handles(c){
  var p = c.p, qm;

    case 'linear': return [{k:'q0p0',x:p.q0,y:p.p0},{k:'q1p1',x:p.q1,y:p.p1}];
    case 'kink':   return [{k:'q0p0',x:p.q0,y:p.p0},{k:'qkpk',x:p.qk,y:p.pk},{k:'q1p1',x:p.q1,y:p.p1}];
    case 'kink3':  return [{k:'P0',x:p.q0,y:p.pA},{k:'P1',x:p.q1,y:p.pA},
                           {k:'P2',x:p.q2,y:p.pB},{k:'P3',x:p.q3,y:p.pB}];
    case 'hline':  return [{k:'p',x:50,y:p.p},{k:'q0',x:p.q0,y:p.p},{k:'q1',x:p.q1,y:p.p}];
    case 'vline':  return [{k:'q',x:p.q,y:50},{k:'p0',x:p.q,y:p.p0},{k:'p1',x:p.q,y:p.p1}];
    case 'hyperbola':
      qm=(p.q0+p.q1)/2;
      return [{k:'k',x:qm,y:p.k/qm},{k:'q0',x:p.q0,y:p.k/p.q0},{k:'q1',x:p.q1,y:p.k/p.q1}];
    case 'kinkedAS': return [{k:'p0',x:14,y:p.p0},{k:'q1',x:p.q1,y:p.p0},
                             {k:'bend',x:(p.q1+p.q2)/2,y:p.p0+(p.p2-p.p0)*Math.pow(0.5,p.gamma)},
                             {k:'q2',x:p.q2,y:p.p2}];
    /* two intercepts plus one curvature grip sitting on the curve at half of X */
    case 'ppc':    return [{k:'a',x:p.a,y:0}, {k:'b',x:0,y:p.b},

function moveHandle(c,hk,mx,my){
  var p = c.p, i, tm, want, qq;
  mx = clamp(mx,0,100); my = clamp(my,0,100);
  switch(c.shape){
    case 'linear':
      if(hk==='q0p0'){ p.q0=mx; p.p0=my; } else { p.q1=mx; p.p1=my; }
      break;
    case 'kink':
      if(hk==='q0p0'){ p.q0=mx; p.p0=my; }
      else if(hk==='qkpk'){ p.qk=mx; p.pk=my; }
      else { p.q1=mx; p.p1=my; }
      break;
    case 'kink3':
      if(hk==='P0'){ p.q0=Math.min(mx, p.q1-4); p.pA=my; p.q1=Math.max(p.q1,p.q0+4); }
      else if(hk==='P1'){ p.q1=clamp(mx, p.q0+4, p.q2-4); p.pA=my; }
      else if(hk==='P2'){ p.q2=clamp(mx, p.q1+4, p.q3-4); p.pB=my; }
      else { p.q3=Math.max(mx, p.q2+4); p.pB=my; }
      break;
    case 'hline':
      if(hk==='p') p.p = my;
      else if(hk==='q0') p.q0 = Math.min(mx, p.q1-6);
      else p.q1 = Math.max(mx, p.q0+6);
      break;
    case 'vline':
      if(hk==='q') p.q = mx;
      else if(hk==='p0') p.p0 = Math.min(my, p.p1-6);
      else p.p1 = Math.max(my, p.p0+6);
      break;
    case 'hyperbola':
      if(hk==='k'){ qq=clamp(mx,5,100); p.k = clamp(my,2,100)*qq; }
      else if(hk==='q0'){ p.q0 = clamp(mx,2,p.q1-6); }
      else { p.q1 = clamp(mx,p.q0+6,100); }
      break;
    case 'ppc':
      /* a and b are the two intercepts; the third grip bends the curve without
         moving the intercepts, which is exactly the constant-cost question */
      if(hk==='a'){ p.a = clamp(mx, 10, 100); }
      else if(hk==='b'){ p.b = clamp(my, 10, 100); }
      else { p.n = ppcBowToN(my / Math.max(10, p.b) - 0.5); }   /* signed bow */
      break;
    case 'kinkedAS':
      if(hk==='p0') p.p0 = my;
      else if(hk==='q1') p.q1 = clamp(mx,2,p.q2-6);
      else if(hk==='q2'){ p.q2 = clamp(mx,p.q1+6,100); p.p2 = my; }
      else if(hk==='bend'){
        tm = (mx - p.q1)/(p.q2-p.q1);
        if(tm>0.08 && tm<0.92 && my > p.p0+0.5){
          want = clamp((my-p.p0)/(p.p2-p.p0), 0.01, 2.5);
          p.gamma = clamp(Math.log(want)/Math.log(tm), 1.05, 6);
        }
      }
      break;
    case 'smooth':
      i = parseInt(hk.slice(2),10);
      if(p.pts[i]){ p.pts[i].x=mx; p.pts[i].y=my; }
      break;
  }
}

/* ---------- intersections ---------- */
function segInt(a,b,c,d){
  var r1=a.x, r2v=a.y, s1=b.x-a.x, s2=b.y-a.y;
  var t1=c.x, t2=c.y, u1=d.x-c.x, u2=d.y-c.y;
  var den = s1*u2 - s2*u1;
  if(Math.abs(den) < 1e-12) return null;
  var t = ((t1-r1)*u2 - (t2-r2v)*u1)/den;
  var u = ((t1-r1)*s2 - (t2-r2v)*s1)/den;
  if(t < -1e-9 || t > 1+1e-9 || u < -1e-9 || u > 1+1e-9) return null;
  return {x: r1+s1*t, y: r2v+s2*t};
}
function polyInt(A,B){
  var raw=[], res=[], i, j, pt, m, k, dup;
  for(i=0;i<A.length-1;i++)
    for(j=0;j<B.length-1;j++){
      pt = segInt(A[i],A[i+1],B[j],B[j+1]);
      if(pt) raw.push(pt);
    }
  for(k=0;k<raw.length;k++){
    m = raw[k]; dup = false;
    for(i=0;i<res.length;i++) if(Math.abs(res[i].x-m.x)<0.4 && Math.abs(res[i].y-m.y)<0.4){ dup=true; break; }
    if(!dup) res.push(m);
  }
  return res;
}
function xAtY(poly, yy){
  for(var i=0;i<poly.length-1;i++){
    var a=poly[i], b=poly[i+1];
    if((a.y-yy)*(b.y-yy) <= 0 && Math.abs(b.y-a.y) > 1e-9){
      var x = a.x + ((yy-a.y)/(b.y-a.y))*(b.x-a.x);
      if(x>=0 && x<=100) return x;
    }
  }
  return null;
}
function yAtX(poly, xx){
  for(var i=0;i<poly.length-1;i++){
    var a=poly[i], b=poly[i+1];
    if((a.x-xx)*(b.x-xx) <= 0 && Math.abs(b.x-a.x) > 1e-9){
      return a.y + ((xx-a.x)/(b.x-a.x))*(b.y-a.y);
    }
  }
  return null;
}
/* same, but extends the end segments when the curve does not reach that far.
   Surplus areas are measured from Q = 0, and most curves start further right. */
function yAtXAny(poly, xx){
  var y = yAtX(poly, xx);
  if(y != null) return y;
  if(!poly || poly.length < 2) return null;
  var a, b;
  if(xx <= poly[0].x){ a = poly[0]; b = poly[1]; }
  else if(xx >= poly[poly.length-1].x){ a = poly[poly.length-2]; b = poly[poly.length-1]; }
  else return null;
  if(Math.abs(b.x - a.x) < 1e-9) return null;   /* vertical: nothing to extrapolate */
  return a.y + ((xx-a.x)/(b.x-a.x))*(b.y-a.y);
}
/* the stretch of a polyline between two quantities, walked from qA to qB */
function segFrom(pts, qA, qB){
  var lo = Math.min(qA,qB), hi = Math.max(qA,qB), out = [], i;
  var yLo = yAtXAny(pts, lo), yHi = yAtXAny(pts, hi);
  if(yLo != null) out.push({x:lo, y:yLo});
  for(i=0;i<pts.length;i++) if(pts[i].x > lo && pts[i].x < hi) out.push(pts[i]);
  if(yHi != null) out.push({x:hi, y:yHi});
  if(qB < qA) out.reverse();
  return out;
}
/* consumer / producer surplus as a closed ring, for a given equilibrium */
function surplusRing(kind, dCurve, sCurve, eq){
  if(!eq) return null;
  var qe = eq.x, pe = eq.y, mid;
  if(kind === 'cs'){
    mid = segFrom(sampleCurve(dCurve), 0, qe);
    if(mid.length < 2) return null;
    return [{x:0,y:pe}].concat(mid).concat([{x:qe,y:pe}]);
  }
  mid = segFrom(sampleCurve(sCurve), qe, 0);
  if(mid.length < 2) return null;
  return [{x:0,y:pe},{x:qe,y:pe}].concat(mid);
}
/* the deadweight-loss ring between the social curve and the private curve */
function dwlRing(socialPts, otherPts, qMarket, qOpt){
  if(qMarket == null || qOpt == null || Math.abs(qOpt-qMarket) < 0.5) return null;
  var ring = segFrom(socialPts, qMarket, qOpt).concat(segFrom(otherPts, qOpt, qMarket));
  return ring.length >= 3 ? ring : null;
}
function curveById(id){ for(var i=0;i<S.curves.length;i++) if(S.curves[i].id===id) return S.curves[i]; return null; }
function markById(id){ for(var i=0;i<S.marks.length;i++) if(S.marks[i].id===id) return S.marks[i]; return null; }

function activePair(){
  var d = curveById(S.activeD), s = curveById(S.activeS);
  /* second line of defence: whatever put a PPC in the active slot, it must never
     be intersected with the other axis */
  if(d && d.role==='PPC') d = null;
  if(s && s.role==='PPC') s = null;
  return {d:(d&&d.visible)?d:null, s:(s&&s.visible)?s:null};
}
function liveEq(){
  var pr = activePair(), i, p;
  if(!pr.d || !pr.s){ lastEq=null; return null; }
  var pts = polyInt(sampleCurve(pr.d), sampleCurve(pr.s)), keep = [];
  for(i=0;i<pts.length;i++){
    p = pts[i];
    if(p.x>=-0.01 && p.x<=100.01 && p.y>=-0.01 && p.y<=100.01) keep.push(p);
  }
  if(!keep.length){ lastEq=null; return null; }
  var ref = lastEq || {x:50,y:50}, pick = keep[0], bd = Infinity;
  for(i=0;i<keep.length;i++){
    var dd = (keep[i].x-ref.x)*(keep[i].x-ref.x) + (keep[i].y-ref.y)*(keep[i].y-ref.y);
    if(dd<bd){ bd=dd; pick=keep[i]; }
  }
  lastEq = {x:pick.x, y:pick.y};
  return pick;
}
function liveEqLabel(){ return S.eqHistory.length ? ('E'+(S.eqHistory.length+1)) : 'E'; }
function renumberEq(){ for(var i=0;i<S.eqHistory.length;i++) S.eqHistory[i].label = 'E'+(i+1); }
function pushEquilibrium(eq){
  if(!eq) return null;
  S.eqHistory.push({id:uid('e'), label:'', x:eq.x, y:eq.y});
  renumberEq();
  return S.eqHistory[S.eqHistory.length-1];
}

/* ---------- curve helpers ---------- */
function nextLabel(role){
  var found = false, max = 0, i, c, m, n;
  for(i=0;i<S.curves.length;i++){
    c = S.curves[i];
    if(c.role !== role) continue;
    found = true;
    m = /^([A-Za-z]*)(\d*)$/.exec(c.label);
    if(!m) continue;
    n = m[2] ? parseInt(m[2],10) : 0;
    if(n > max) max = n;
  }
  if(!found) return role;          /* first curve of this role keeps the bare label */
  return role + (max + 1);         /* second one becomes D1, third D2 ... */
}
/* numbering for a shifted copy: keep the base's own prefix, so AD becomes AD1 (not D1) */
function nextLabelLike(baseLabel, role){
  var m0 = /^([A-Za-z]+)(\d*)$/.exec(String(baseLabel));
  var prefix = m0 ? m0[1] : String(baseLabel);
  var found = false, max = 0, i, c, mm, n;
  for(i=0;i<S.curves.length;i++){
    c = S.curves[i];
    if(c.role !== role) continue;
    found = true;
    mm = /^([A-Za-z]+)(\d*)$/.exec(c.label);
    if(!mm || mm[1] !== prefix) continue;
    n = mm[2] ? parseInt(mm[2],10) : 0;
    if(n > max) max = n;
  }
  if(!found) return prefix;
  return prefix + (max + 1);
}
function addCurve(kind, opts){
  opts = opts || {};
  var role = opts.role || SHAPES[kind].role;
  var c = {
    id: uid('c'), shape: kind, role: role,
    label: opts.label || nextLabel(role),
    color: opts.color || ROLE_COLOR[role] || '#495057',
    width: 3, dash: !!opts.dash, visible: true,
    sign: (role==='S' || role==='AS' || role==='LRAS') ? 1 : -1,
    p: Object.assign(defaultGeom(kind, role), opts.p || {})
  };
  if(kind==='smooth'){
    var src = (opts.p && opts.p.pts) ? opts.p.pts : defaultShape('smooth').pts;
    c.p.pts = src.map(function(o){ return {x:o.x,y:o.y}; });
  }
  S.curves.push(c);
  return c;
}
function translateCurve(c, dq, dp){
  var p = c.p, i;
  switch(c.shape){
    case 'linear': p.q0+=dq; p.p0+=dp; p.q1+=dq; p.p1+=dp; break;
    case 'kink':   p.q0+=dq; p.p0+=dp; p.qk+=dq; p.pk+=dp; p.q1+=dq; p.p1+=dp; break;
    case 'kink3':  p.q0+=dq; p.q1+=dq; p.q2+=dq; p.q3+=dq; p.pA+=dp; p.pB+=dp; break;
    case 'hline':  p.q0+=dq; p.q1+=dq; p.p+=dp; break;
    case 'vline':  p.q+=dq; p.p0+=dp; p.p1+=dp; break;
    case 'hyperbola': p.k = Math.max(2, p.k + (dq/100)*p.k*2); break;
    case 'kinkedAS': p.q1+=dq; p.q2+=dq; p.p0+=dp; p.p2+=dp;
                     p.pMax = clamp(p.pMax+dp, Math.max(10,p.p2+4), 100); break;
    /* moving a PPC means growing capacity on both axes - that is the whole point */
    case 'ppc':    p.a = clamp(p.a + dq, 8, 100); p.b = clamp(p.b + dp, 8, 100); break;
    case 'smooth':
      for(i=0;i<p.pts.length;i++){ p.pts[i].x+=dq; p.pts[i].y+=dp; }

}
function cloneShift(base, dq, dp){
  var lbl = nextLabelLike(base.label, base.role);   /* resolve BEFORE pushing the copy */
  var c = {
    id: uid('c'), shape: base.shape, role: base.role,
    label: lbl, color: base.color, width: base.width, dash: base.dash,
    visible: true, baseId: base.id, p: JSON.parse(JSON.stringify(base.p))
  };
  S.curves.push(c);
  translateCurve(c, dq, dp);
  return c;
}
function setActiveCurve(c){
  /* a PPC is nobody's demand - letting it become activeD would pair it with the
     supply and invent an equilibrium on the frontier */
  if(c.role==='S'||c.role==='AS'||c.role==='LRAS') S.activeS = c.id;
  else if(c.role!=='X' && c.role!=='PPC') S.activeD = c.id;
}

/* =====================================================================
   direct shape editing: midpoint, rotation, one-click conversions
   ===================================================================== */
function curveMid(c){
  var p = c.p, pts;
  if(c.shape==='linear') return {x:(p.q0+p.q1)/2, y:(p.p0+p.p1)/2};
  if(c.shape==='kink')   return {x:p.qk, y:p.pk};   /* the corner itself is the natural pivot */
  if(c.shape==='kink3')  return {x:(p.q1+p.q2)/2, y:(p.pA+p.pB)/2};
  if(c.shape==='hline')  return {x:(p.q0+p.q1)/2, y:p.p};
  if(c.shape==='vline')  return {x:p.q, y:(p.p0+p.p1)/2};
  pts = sampleCurve(c);
  if(!pts.length) return null;
  return pts[Math.floor((pts.length-1)/2)];
}
function rotatable(c){ return c.shape !== 'kinkedAS' && c.shape !== 'kink' && c.shape !== 'kink3'; }
function angleCapable(c){ return c.shape==='linear' || c.shape==='hline' || c.shape==='vline'; }
/* the curve's visual angle in degrees: + = rising to the right (supply), - = falling (demand) */
function curveAngle(c){
  var pts = sampleCurve(c);
  if(pts.length < 2) return 0;
  var a = pts[0], b = pts[pts.length-1];
  return -Math.atan2(Y(b.y)-Y(a.y), X(b.x)-X(a.x)) * 180/Math.PI;
}
/* the slider runs from flat (left) to upright (right); the direction is kept separately
   so that dragging only ever changes steepness, never flips a demand into a supply */
function curveSign(c){
  var a = curveAngle(c);
  /* a vertical line has no meaningful direction, so fall back to what was remembered
     (otherwise passing through "upright" would flip a demand into a supply) */
  if(Math.abs(a) < 85 && Math.abs(a) > 0.5) return a > 0 ? 1 : -1;
  if(c.sign) return c.sign;
  return (c.role==='S' || c.role==='AS' || c.role==='LRAS') ? 1 : -1;
}
function curveSteep(c){ return Math.abs(curveAngle(c)); }
/* set an absolute angle, keeping the midpoint and the on-screen length */
function setCurveAngle(c, deg){
  if(!angleCapable(c)) return;
  var mid = curveMid(c), pts = sampleCurve(c);
  var a = pts[0], b = pts[pts.length-1];
  var L = Math.max(70, Math.sqrt(Math.pow(X(b.x)-X(a.x),2) + Math.pow(Y(b.y)-Y(a.y),2))) / 2;
  var rad = deg * Math.PI/180;
  var cx = X(mid.x), cy = Y(mid.y);
  var dx = Math.cos(rad)*L, dy = -Math.sin(rad)*L;   /* screen y grows downward */
  c.shape = 'linear';
  c.p = { q0: invX(cx-dx), p0: invY(cy-dy), q1: invX(cx+dx), p1: invY(cy+dy) };
  if(Math.abs(deg) > 0.5 && Math.abs(deg) < 85) c.sign = deg > 0 ? 1 : -1;
}
/* slider handler: 0 = perfectly elastic, 90 = perfectly inelastic */
function applySteep(c, v){
  var sgn = curveSign(c);
  if(v <= 1)      convertShape(c, 'hline');
  else if(v >= 89) convertShape(c, 'vline');
  else             setCurveAngle(c, sgn * v);
  return sgn;
}
/* rotate about (cx,cy) in MATH coords, but by a SCREEN-space angle so dragging feels right */
function rotateCurveScreen(c, cx, cy, ang){
  var cs = Math.cos(ang), sn = Math.sin(ang), i, r;
  function rot(q, p){
    var sx = X(q) - X(cx), sy = Y(p) - Y(cy);
    return {x: invX(X(cx) + sx*cs - sy*sn), y: invY(Y(cy) + sx*sn + sy*cs)};
  }
  if(c.shape==='linear'){
    r = rot(c.p.q0, c.p.p0); c.p.q0=r.x; c.p.p0=r.y;
    r = rot(c.p.q1, c.p.p1); c.p.q1=r.x; c.p.p1=r.y;
  } else if(c.shape==='kink'){
    r = rot(c.p.q0, c.p.p0); c.p.q0=r.x; c.p.p0=r.y;
    r = rot(c.p.qk, c.p.pk); c.p.qk=r.x; c.p.pk=r.y;
    r = rot(c.p.q1, c.p.p1); c.p.q1=r.x; c.p.p1=r.y;
  } else if(c.shape==='kink3'){
    r = rot(c.p.q0, c.p.pA); c.p.q0=r.x; c.p.pA=r.y;
    r = rot(c.p.q1, c.p.pA); c.p.q1=r.x; c.p.pA=r.y;
    r = rot(c.p.q2, c.p.pB); c.p.q2=r.x; c.p.pB=r.y;
    r = rot(c.p.q3, c.p.pB); c.p.q3=r.x; c.p.pB=r.y;
  } else if(c.shape==='hline'){
    var h0=c.p.q0, h1=c.p.q1, hp=c.p.p;
    c.shape='linear'; c.p={q0:h0,p0:hp,q1:h1,p1:hp};
    rotateCurveScreen(c, cx, cy, ang);
  } else if(c.shape==='vline'){
    var vq=c.p.q, v0=c.p.p0, v1=c.p.p1;
    c.shape='linear'; c.p={q0:vq,p0:v0,q1:vq,p1:v1};
    rotateCurveScreen(c, cx, cy, ang);
  } else if(c.shape==='smooth'){
    for(i=0;i<c.p.pts.length;i++){
      r = rot(c.p.pts[i].x, c.p.pts[i].y);
      c.p.pts[i].x=r.x; c.p.pts[i].y=r.y;
    }
  } else if(c.shape==='hyperbola'){
    var pts = sampleCurve(c), np = [];
    for(i=0;i<9;i++){
      var pt = pts[Math.round(i*(pts.length-1)/8)];

    }
    c.shape = 'smooth'; c.p = {pts:np};
  }
}
/* switch shape, deriving the new geometry from where the curve currently sits */
function convertShape(c, kind){
  var mid = curveMid(c) || {x:50, y:50};
  var pts = sampleCurve(c);
  var down = pts.length>1 && pts[0].y > pts[pts.length-1].y;
  var wasPPC = (c.role === 'PPC');
  /* a PPC is a chart of its own: while it is one it must not stay paired to the
     other axis, or the pair would sprout an equilibrium point nobody asked for.
     Entering is handled here; leaving is handled once, after the shape is built,
     so that every route back out (the quick buttons included) restores the role. */
  if(kind === 'ppc'){
    c.role = 'PPC'; c.shape = 'ppc'; c.sign = 1;
    if(c.color === ROLE_COLOR.D || c.color === ROLE_COLOR.S) c.color = ROLE_COLOR.PPC;
    if(S.activeD === c.id) S.activeD = null;
    if(S.activeS === c.id) S.activeS = null;
    if(S.arrowPair && (S.arrowPair.a === c.id || S.arrowPair.b === c.id)) S.arrowPair = null;
    c.p = defaultShape('ppc');
    return;
  }
  if(kind==='hline'){
    c.shape='hline'; c.p = {p:clamp(mid.y,2,98), q0:0, q1:100};
  } else if(kind==='vline'){
    c.shape='vline'; c.p = {q:clamp(mid.x,2,98), p0:0, p1:100};
  } else if(kind==='slopeDown' || kind==='slopeUp'){
    var up = (kind==='slopeUp');
    c.shape='linear'; c.sign = up ? 1 : -1;
    c.p = {q0:8, p0:clamp(mid.y + (up?-38:38), 1, 99),
           q1:92, p1:clamp(mid.y + (up? 38:-38), 1, 99)};
  } else if(kind==='linear'){
    c.shape='linear'; c.sign = down ? -1 : 1;
    c.p = down ? {q0:8, p0:clamp(mid.y+38,1,99), q1:92, p1:clamp(mid.y-38,1,99)}
               : {q0:8, p0:clamp(mid.y-38,1,99), q1:92, p1:clamp(mid.y+38,1,99)};
  } else {
    c.shape = kind;
    c.p = defaultGeom(kind, c.role);
    if(kind==='smooth') c.p.pts = defaultGeom('smooth', c.role).pts.map(function(o){ return {x:o.x,y:o.y}; });
  }
  if(wasPPC){
    if(isPPCDiagram()){
      /* still a frontier canvas: whatever the shape became, it stays a frontier
         curve. Only switching the whole diagram turns it into a market curve. */
      c.role = 'PPC';
      if(c.color !== ROLE_COLOR.PPC) c.color = ROLE_COLOR.PPC;
    } else {
      /* the diagram is a market, so the curve has to be adopted by the pair or it
         would sit on the canvas doing nothing at all */
      var want = (kind === 'slopeUp') ? 'S'
               : (kind === 'slopeDown') ? 'D'
               : (SHAPES[kind] && SHAPES[kind].role !== 'PPC') ? SHAPES[kind].role
               : (down ? 'D' : 'S');
      c.role = want;
      if(c.color === ROLE_COLOR.PPC) c.color = ROLE_COLOR[want] || '#495057';
      c.sign = (want === 'S' || want === 'AS' || want === 'LRAS') ? 1 : -1;
      if(want === 'S' || want === 'AS' || want === 'LRAS') S.activeS = c.id;
      else S.activeD = c.id;
    }
  }
}

/* ---------- save, open, and the local draft ----------
   A diagram is worth keeping: you build it at home and show it next lesson, or on
   a different computer. So it round-trips through a plain .json file, and the last
   state is also kept in the browser so a refresh does not cost you the work. */
var FILE_APP = 'Econ Diagram Studio', FILE_VER = 1;
var DRAFT_KEY = 'econDiagramStudio.draft';
function diagramFile(){
  return {app: FILE_APP, version: FILE_VER, saved: new Date().toISOString(), diagram: S};
}
function suggestName(){
  var t = String(S.title || '').trim().replace(/[\\/:*?"<>|]+/g, '-').slice(0, 60);
  if(!t) t = (diagramKind() === 'ppc' ? 'PPC diagram' : 'Market diagram');
  return t + '.json';
}
function saveDiagram(){
  var a = document.createElement('a'), url = null;
  try{
    url = URL.createObjectURL(new Blob([JSON.stringify(diagramFile(), null, 2)],
                                       {type:'application/json'}));
  }catch(e){ toast('This browser will not let the file be saved.'); return false; }
  a.href = url; a.download = suggestName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
  toast('Saved as ' + a.download);
  return true;
}
/* Deliberately forgiving: accepts the wrapper or a bare state, and fills in every
   field the file does not carry, so a diagram saved by an older build still opens
   instead of throwing. */
function adoptState(raw){
  var d = (raw && raw.diagram) ? raw.diagram : raw;
  if(!d || typeof d !== 'object' || !Array.isArray(d.curves)) throw new Error('not a diagram');
  var st = blankState();
  st.kind = (d.kind === 'ppc') ? 'ppc' : 'market';
  if(typeof d.title === 'string') st.title = d.title;
  if(d.axes && typeof d.axes === 'object'){
    st.axes = {xLabel: strOr(d.axes.xLabel, st.axes.xLabel),
               yLabel: strOr(d.axes.yLabel, st.axes.yLabel),
               ticks: !!d.axes.ticks, grid: !!d.axes.grid};
  }
  if(d.opts && typeof d.opts === 'object') st.opts = Object.assign(st.opts, d.opts);
  if(typeof d.shiftStep === 'number') st.shiftStep = clamp(d.shiftStep, 2, 40);
  st.curves = d.curves.filter(function(c){ return c && typeof c === 'object' && c.id && c.p; })
                      .map(function(c){ return JSON.parse(JSON.stringify(c)); });
  st.marks = Array.isArray(d.marks) ? JSON.parse(JSON.stringify(d.marks)) : [];
  st.eqHistory = Array.isArray(d.eqHistory) ? JSON.parse(JSON.stringify(d.eqHistory)) : [];
  st.labelOff = (d.labelOff && typeof d.labelOff === 'object') ? d.labelOff : {};
  st.labelText = (d.labelText && typeof d.labelText === 'object') ? d.labelText : {};
  st.ext = d.ext || null;
  var ids = {};
  st.curves.forEach(function(c){ ids[c.id] = 1; });
  ['activeD','activeS'].forEach(function(k){
    if(typeof d[k] === 'string' && ids[d[k]]) st[k] = d[k];
  });
  if(d.arrowPair && ids[d.arrowPair.a] && ids[d.arrowPair.b]){
    st.arrowPair = {a: d.arrowPair.a, b: d.arrowPair.b};
  }
  /* a frontier curve makes it a frontier whatever the file claimed */
  if(st.curves.some(function(c){ return c.role === 'PPC'; })) st.kind = 'ppc';
  st.sel = null;
  return st;
}
function strOr(v, dflt){ return (typeof v === 'string' && v) ? v : dflt; }
function loadDiagramText(txt, label){
  var raw;
  try{ raw = JSON.parse(txt); }
  catch(e){ toast('That file is not readable as JSON.'); return false; }
  var st;
  try{ st = adoptState(raw); }catch(e){ toast('That file is not a diagram from this studio.'); return false; }
  pushUndo();
  S = st; lastEq = null;
  syncTitle(); syncKind(); syncRail(); render(); renderInspector(true); updateUndoBtns();
  saveDraft();
  toast((label ? label + ' opened.' : 'Diagram opened.'));
  return true;
}
function openDiagramFile(){
  var inp = document.getElementById('fileOpen');
  if(!inp) return;
  inp.value = '';               /* picking the same file twice must still fire */
  inp.click();
}
/* `?fresh=1` starts from a clean sheet and leaves the stored draft alone. Screenshot
   and probe harnesses load the file dozens of times and reuse their browser profile,
   so without this a leftover draft would change what they think they are testing. */
function draftsOffFor(q){ return /[?&]fresh=1(&|$)/.test(String(q || '')); }
function draftsOff(){ return draftsOffFor(location.search); }
function saveDraft(){
  if(draftsOff()) return;
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(diagramFile())); }catch(e){}
}
function loadDraft(){
  try{
    var t = localStorage.getItem(DRAFT_KEY);
    return t ? JSON.parse(t) : null;
  }catch(e){ return null; }
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
/* render() is the one place every change funnels through, so the draft is written
   from there - but coalesced, because a drag calls render() on every frame */
var draftTimer = null;
function touchDraft(){
  if(draftTimer) return;
  draftTimer = setTimeout(function(){ draftTimer = null; saveDraft(); }, 900);
}

/* ---------- undo ---------- */
function snapshot(){ return JSON.stringify(S); }
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length > 150) undoStack.shift();
  redoStack.length = 0;
  updateUndoBtns();
}
function commitDrag(){
  if(drag && !drag.committed){
    undoStack.push(drag.pre);
    if(undoStack.length > 150) undoStack.shift();
    redoStack.length = 0;
    drag.committed = true;
    updateUndoBtns();
  }
}
function restore(str){
  S = JSON.parse(str);
  lastEq = null; syncTitle();
  /* an undo can cross a diagram-type switch, so the header and the rail have to
     come back with it - otherwise the tools on screen belong to the other chart */
  syncKind(); syncRail();
  render(); renderInspector(true); updateUndoBtns();
}
function doUndo(){ if(!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); }
function doRedo(){ if(!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); }
function updateUndoBtns(){
  document.getElementById('btnUndo').disabled = !undoStack.length;
  document.getElementById('btnRedo').disabled = !redoStack.length;
}

/* ---------- item list ---------- */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function arrowHead(p1,p2,size){
  var dx=p2.x-p1.x, dy=p2.y-p1.y, L=Math.sqrt(dx*dx+dy*dy);
  if(L<1e-6) return null;
  var ux=dx/L, uy=dy/L, s=size||11;
  var bx=p2.x-ux*s, by=p2.y-uy*s, px=-uy*s*0.46, py=ux*s*0.46;
  return [{x:p2.x,y:p2.y},{x:bx+px,y:by+py},{x:bx-px,y:by-py}];
}
function pathItem(pts, stroke, w, dash, extra){
  var o = {t:'path', pts:pts, stroke:stroke, w:w, dash:dash||null, cap:'round', join:'round'};
  if(extra) for(var k in extra) o[k]=extra[k];
  return o;
}
function labelItem(x,y,s,size,color,anchor,weight,halo){
  return {t:'text', x:x, y:y, s:s, size:size||28, color:color||'#252523',
          weight:weight||600, anchor:anchor||'start', halo:halo!==false};
}
function labelPos(pts){
  var best = pts[0];
  for(var i=0;i<pts.length;i++){
    var pt = pts[i];
    if(pt.y > best.y+1e-9 || (Math.abs(pt.y-best.y)<1e-9 && pt.x>best.x)) best = pt;
  }
  return {x: clamp(best.x+3,1,97), y: clamp(best.y+3.5,3,96)};
}
/* a label anchored at its start would run off the right edge of the plot,
   so flip the anchor for anything close to the boundary */
function curveLabel(pts, text, color){
  var lp = labelPos(pts);
  var est = String(text).length * 28 * 0.62;
  var x = X(lp.x);
  var anchor = (x + est > PLOT.x1 - 4) ? 'end' : 'start';
  return labelItem(x, Y(lp.y), text, 28, color, anchor, 700, true);
}
function dot(x,y,r,fill,stroke,sw,dash){

  var off = (key && S.labelOff && S.labelOff[key]) || null;
  function boxOf(px, py){
    var bx = ha==='middle' ? px - est/2 : (ha==='end' ? px - est : px);
    return {x0:bx, x1:bx+est, y0:py - size*0.80, y1:py + size*0.22};
  }

    var item = labelItem(px, py, text, size, color, ha, weight, true);

  }
  if(off){
    var mx = x + off.dx, my = y + off.dy;
    placed.push(boxOf(mx, my));
    return emit(mx, my);

    }
    else if(m.kind==='text'){
      /* a free text box is moved by dragging the mark itself, so it deliberately
         carries no `lbl` key - a label grab-box here would hijack that drag */
      it.push({t:'text', x:X(m.x), y:Y(m.y), s:m.text, size:m.size||24, color:m.color||'#252523',
               weight:m.weight||500, anchor:'start', halo:true});
    }
    else if(m.kind==='arrow'){
      p1={x:X(m.x1),y:Y(m.y1)}; p2={x:X(m.x2),y:Y(m.y2)};
      it.push(pathItem([p1,p2], m.color||'#252523', 3, null, {arrow:true, head:15}));
      if(m.label){
        var alOff = (S.labelOff && S.labelOff['m:'+m.id]) || {dx:0, dy:0};
        it.push(Object.assign(
          labelItem((p1.x+p2.x)/2+8+alOff.dx, (p1.y+p2.y)/2-12+alOff.dy,
                    labelText('m:'+m.id, m.label), 23, m.color||'#252523','start',600,true),
          {lbl:'m:'+m.id}));
      }
    }
    else if(m.kind==='bracket'){
      var along = (m.axis==='x'), col = m.color||'#252523';
      if(along){
        var q1=X(m.from), q2v=X(m.to), lo=Math.min(q1,q2v), hi=Math.max(q1,q2v);
        var base=Y(0), tip=base+OFF;
        it.push(Object.assign(pathItem([{x:lo,y:base},{x:lo,y:tip}], col, 2, null), {noClip:true}));
        it.push(Object.assign(pathItem([{x:hi,y:base},{x:hi,y:tip}], col, 2, null), {noClip:true}));
        it.push(Object.assign(pathItem([{x:lo,y:tip},{x:hi,y:tip}], col, 2, null), {noClip:true}));
        it.push(Object.assign({t:'text', x:(lo+hi)/2, y:tip-12, s:m.label||'', size:23, color:col,
          weight:700, anchor:'middle', halo:true, noClip:true}));
      } else {
        var p1v=Y(m.from), p2v=Y(m.to), lo2=Math.min(p1v,p2v), hi2=Math.max(p1v,p2v);
        var base2=X(0), tip2=base2-OFF;
        it.push(Object.assign(pathItem([{x:base2,y:lo2},{x:tip2,y:lo2}], col, 2, null), {noClip:true}));
        it.push(Object.assign(pathItem([{x:base2,y:hi2},{x:tip2,y:hi2}], col, 2, null), {noClip:true}));
        it.push(Object.assign(pathItem([{x:tip2,y:lo2},{x:tip2,y:hi2}], col, 2, null), {noClip:true}));
        it.push(Object.assign({t:'text', x:tip2-9, y:(lo2+hi2)/2+8, s:m.label||'', size:23, color:col,
          weight:700, anchor:'end', halo:true, noClip:true}));
      }
    }
  }
  if(!forExport && pending){
    if(pending.type==='bracket' && pending.from!=null){
      var bx2 = (pending.axis==='x') ? X(pending.from) : X(0)-OFF;
      var by2 = (pending.axis==='x') ? Y(0)+OFF : Y(pending.from);
      it.push({t:'circle', x:bx2, y:by2, r:7, fill:'#ffffff', stroke:'#1971c2', w:2.5, dash:null});
    }
    if(pending.type==='region' && pending.pts.length){
      var rp = pending.pts.map(function(p){ return {x:X(p.x),y:Y(p.y)}; });
      if(rp.length>=2) it.push(pathItem(rp, '#1971c2', 2, '6 4'));
      it.push({t:'poly', pts:rp, fill:'#a5d8ff', opacity:0.35, stroke:null, w:0});
      for(j=0;j<rp.length;j++) it.push({t:'circle', x:rp[j].x, y:rp[j].y, r:6, fill:'#fff', stroke:'#1971c2', w:2.5, dash:null});
    }
  }
  if(!forExport && S.sel && S.sel.type==='curve'){
    c = curveById(S.sel.id);
    if(c && c.visible){
      var hs = handles(c);
      for(i=0;i<hs.length;i++)
        it.push({t:'circle', x:X(hs[i].x), y:Y(hs[i].y), r:8, fill:'#ffffff', stroke:'#1971c2',
                 w:3, dash:null, handle:true, curveId:c.id, hk:hs[i].k});
    }
  }
  return it;
}

/* ---------- SVG renderer ---------- */
var svg = document.getElementById('canvas');
function splitLabel(s){
  var m = /^(.*?)([0-9]+)$/.exec(String(s));
  if(m && m[1]) return {base:m[1], sub:m[2]};
  return {base:String(s), sub:''};
}
function textNode(it){
  var sp = splitLabel(it.s);
  var style = 'font-family:'+FONT+';font-size:'+it.size+'px;font-weight:'+(it.weight||600)+';';
  var paint = 'fill="'+it.color+'"';
  if(it.halo) paint += ' stroke="#ffffff" stroke-width="'+(it.size*0.2).toFixed(1)+
                       '" paint-order="stroke" stroke-linejoin="round"';
  var inner = esc(sp.base) +
    (sp.sub ? '<tspan font-size="'+(it.size*0.7)+'" dy="'+(it.size*0.24).toFixed(1)+'">'+esc(sp.sub)+'</tspan>' : '');
  return '<text x="'+r2(it.x)+'" y="'+r2(it.y)+'" text-anchor="'+(it.anchor||'start')+
         '" style="'+style+'" '+paint+'>'+inner+'</text>';
}
function itemsToSVG(items){
  var out = [], i, it, op, d, h, s;
  for(i=0;i<items.length;i++){
    it = items[i];
    if(!it) continue;
    op = (it.opacity!=null) ? ' opacity="'+it.opacity+'"' : '';
    if(it.t==='path'){
      if(!it.pts || it.pts.length<2) continue;
      d = 'M'+it.pts.map(function(p){ return r2(p.x)+','+r2(p.y); }).join(' L');
      out.push('<path d="'+d+'" fill="none" stroke="'+it.stroke+'" stroke-width="'+it.w+'"'+
        (it.dash?' stroke-dasharray="'+it.dash+'"':'')+
        ' stroke-linecap="'+(it.cap||'butt')+'" stroke-linejoin="'+(it.join||'miter')+'"'+op+'/>');
      if(it.arrow){
        h = arrowHead(it.pts[it.pts.length-2], it.pts[it.pts.length-1], it.head||11);
        if(h) out.push('<polygon points="'+h.map(function(p){ return r2(p.x)+','+r2(p.y); }).join(' ')+'" fill="'+it.stroke+'"'+op+'/>');
      }
    }
    else if(it.t==='poly'){
      if(!it.pts || it.pts.length<3) continue;
      out.push('<polygon points="'+it.pts.map(function(p){ return r2(p.x)+','+r2(p.y); }).join(' ')+
        '" fill="'+it.fill+'" fill-opacity="'+(it.opacity!=null?it.opacity:1)+'"'+
        (it.stroke?' stroke="'+it.stroke+'" stroke-width="'+it.w+'"':' stroke="none"')+
        (it.dash?' stroke-dasharray="'+it.dash+'"':'')+'/>');
    }
    else if(it.t==='rect'){
      out.push('<rect x="'+r2(it.x)+'" y="'+r2(it.y)+'" width="'+r2(it.w)+'" height="'+r2(it.h)+
        '" rx="'+(it.rx||0)+'" fill="'+it.fill+'"'+
        (it.stroke?' stroke="'+it.stroke+'" stroke-width="'+(it.sw||1)+'"':'')+op+'/>');
    }
    else if(it.t==='circle'){
      s = '<circle cx="'+r2(it.x)+'" cy="'+r2(it.y)+'" r="'+r2(it.r)+'" fill="'+it.fill+'"';
      if(it.stroke) s += ' stroke="'+it.stroke+'" stroke-width="'+it.w+'"';
      if(it.dash) s += ' stroke-dasharray="'+it.dash+'"';
      if(it.handle) s += ' data-handle="1" data-curve="'+it.curveId+'" data-hk="'+it.hk+'" style="cursor:grab"';
      out.push(s+op+'/>');
    }
    else if(it.t==='text') out.push(textNode(it));
  }
  return out.join('');
}
function hitPathsSVG(items){
  var out = [], i, c, m, pts, dd, w;
  /* movable labels sit on top so a label near a curve still wins the click */
  for(i=0;i<(items||[]).length;i++){
    var lb = items[i];
    if(!lb || lb.t !== 'text' || !lb.lbl) continue;
    var lw = String(lb.s).length * lb.size * 0.62;
    var lx = lb.anchor==='middle' ? lb.x - lw/2 : (lb.anchor==='end' ? lb.x - lw : lb.x);
    /* a label that sits inside a drawn box (the P/Q change pill) wants the whole
       box as its target, not just the glyph run */
    var gx = lb.lblBox ? lb.lblBox.x : lx - 7;
    var gy = lb.lblBox ? lb.lblBox.y : lb.y - lb.size*0.85;
    var gw = lb.lblBox ? lb.lblBox.w : lw + 14;
    var gh = lb.lblBox ? lb.lblBox.h : lb.size*1.15;
    out.push('<rect x="'+r2(gx)+'" y="'+r2(gy)+'" width="'+r2(gw)+
      '" height="'+r2(gh)+'" rx="4" fill="transparent" data-lbl="'+lb.lbl+
      '" style="cursor:grab"/>');
  }
  for(i=0;i<S.curves.length;i++){
    c = S.curves[i];
    if(!c.visible) continue;
    pts = sampleCurve(c);
    if(pts.length<2) continue;
    dd = 'M'+pts.map(function(q){ return r2(X(q.x))+','+r2(Y(q.y)); }).join(' L');
    out.push('<path d="'+dd+'" fill="none" stroke="transparent" stroke-width="18" '+
      'stroke-linecap="round" stroke-linejoin="round" data-hit="'+c.id+'" style="cursor:move"/>');
  }
  for(i=0;i<S.marks.length;i++){
    m = S.marks[i];
    if(m.kind==='point'){
      out.push('<circle cx="'+r2(X(m.x))+'" cy="'+r2(Y(m.y))+'" r="13" fill="transparent" data-mark="'+m.id+'" style="cursor:move"/>');
    } else if(m.kind==='text'){
      w = Math.max(28, String(m.text).length*(m.size||24)*0.6);
      out.push('<rect x="'+r2(X(m.x)-5)+'" y="'+r2(Y(m.y)-(m.size||24))+'" width="'+r2(w)+
        '" height="'+r2((m.size||24)*1.4)+'" fill="transparent" data-mark="'+m.id+'" style="cursor:move"/>');
    } else if(m.kind==='arrow'){
      out.push('<path d="M'+r2(X(m.x1))+','+r2(Y(m.y1))+' L'+r2(X(m.x2))+','+r2(Y(m.y2))+
        '" stroke="transparent" stroke-width="16" data-mark="'+m.id+'" style="cursor:move"/>');
    } else if(m.kind==='region'){
      var rgp = regionRing(m);
      if(rgp && rgp.length >= 3){
        out.push('<polygon points="'+rgp.map(function(p){ return r2(X(p.x))+','+r2(Y(p.y)); }).join(' ')+
          '" fill="transparent" stroke="transparent" stroke-width="12" data-mark="'+m.id+'" style="cursor:pointer"/>');
      }
    } else if(m.kind==='bracket'){
      if(m.axis==='x'){
        out.push('<rect x="'+r2(X(Math.min(m.from,m.to))-8)+'" y="'+r2(Y(0))+'" width="'+
          r2(Math.abs(X(m.to)-X(m.from))+16)+'" height="44" fill="transparent" data-mark="'+m.id+'" style="cursor:pointer"/>');
      } else {
        out.push('<rect x="'+r2(X(0)-44)+'" y="'+r2(Y(Math.max(m.from,m.to))-8)+'" width="50" height="'+
          r2(Math.abs(Y(m.from)-Y(m.to))+16)+'" fill="transparent" data-mark="'+m.id+'" style="cursor:pointer"/>');
      }
    }
  }
  return out.join('');
}
function render(){
  var items = buildItems(false), noClip = [], plot = [], i;
  for(i=0;i<items.length;i++){
    if(!items[i]) continue;
    (items[i].noClip ? noClip : plot).push(items[i]);
  }

    '<defs><clipPath id="plotClip"><rect x="'+PLOT.x0+'" y="'+PLOT.y0+'" width="'+CW+'" height="'+CH+'"/></clipPath></defs>'+
    '<g>'+itemsToSVG(noClip)+'</g>'+
    '<g clip-path="url(#plotClip)">'+itemsToSVG(plot)+'</g>'+
    '<g>'+hitPathsSVG(items)+'</g>';

  if(el) el.textContent = eq ? ('Equilibrium   Q ' + r2(eq.x) + '   P ' + r2(eq.y)) : '';

/* ---------- Canvas renderer ---------- */
function drawText(ctx, it){
  var sp = splitLabel(it.s), small = it.size*0.7;
  ctx.font = (it.weight||600)+' '+it.size+'px '+FONT;
  var wb = ctx.measureText(sp.base).width, ws = 0;
  if(sp.sub){ ctx.font = (it.weight||600)+' '+small+'px '+FONT; ws = ctx.measureText(sp.sub).width; }
  var total = wb+ws, x = it.x;
  if(it.anchor==='middle') x -= total/2;
  else if(it.anchor==='end') x -= total;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if(it.halo){
    ctx.lineWidth = it.size*0.2; ctx.strokeStyle = '#ffffff';
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.font = (it.weight||600)+' '+it.size+'px '+FONT;
    ctx.strokeText(sp.base, x, it.y);
    if(sp.sub){ ctx.font=(it.weight||600)+' '+small+'px '+FONT; ctx.strokeText(sp.sub, x+wb, it.y+small*0.34); }
  }
  ctx.fillStyle = it.color;
  ctx.font = (it.weight||600)+' '+it.size+'px '+FONT;
  ctx.fillText(sp.base, x, it.y);
  if(sp.sub){
    ctx.font = (it.weight||600)+' '+small+'px '+FONT;
    ctx.fillText(sp.sub, x+wb, it.y+small*0.34);
  }
}
function itemsToCanvas(ctx, items){
  var i, j, it, h, rr;
  for(i=0;i<items.length;i++){
    it = items[i];
    if(!it) continue;
    ctx.save();
    ctx.globalAlpha = (it.opacity!=null) ? it.opacity : 1;
    if(it.t==='path'){
      if(!it.pts || it.pts.length<2){ ctx.restore(); continue; }
      ctx.beginPath();
      ctx.moveTo(it.pts[0].x, it.pts[0].y);
      for(j=1;j<it.pts.length;j++) ctx.lineTo(it.pts[j].x, it.pts[j].y);
      ctx.strokeStyle = it.stroke; ctx.lineWidth = it.w;
      ctx.lineCap = it.cap==='round'?'round':'butt';
      ctx.lineJoin = it.join==='round'?'round':'miter';
      if(it.dash) ctx.setLineDash(it.dash.split(/\s+/).map(Number));
      ctx.stroke();
      ctx.setLineDash([]);
      if(it.arrow){
        h = arrowHead(it.pts[it.pts.length-2], it.pts[it.pts.length-1], it.head||11);
        if(h){
          ctx.beginPath();
          ctx.moveTo(h[0].x,h[0].y); ctx.lineTo(h[1].x,h[1].y); ctx.lineTo(h[2].x,h[2].y);
          ctx.closePath(); ctx.fillStyle = it.stroke; ctx.fill();
        }
      }
    }
    else if(it.t==='poly'){
      if(!it.pts || it.pts.length<3){ ctx.restore(); continue; }
      ctx.beginPath();
      ctx.moveTo(it.pts[0].x, it.pts[0].y);
      for(j=1;j<it.pts.length;j++) ctx.lineTo(it.pts[j].x, it.pts[j].y);
      ctx.closePath();
      ctx.fillStyle = it.fill; ctx.fill();
      if(it.stroke){
        ctx.strokeStyle = it.stroke; ctx.lineWidth = it.w||1;
        if(it.dash) ctx.setLineDash(it.dash.split(/\s+/).map(Number));
        ctx.stroke(); ctx.setLineDash([]);
      }
    }
    else if(it.t==='rect'){
      rr = it.rx||0;
      ctx.beginPath();
      if(ctx.roundRect){ ctx.roundRect(it.x,it.y,it.w,it.h,rr); }
      else{
        ctx.moveTo(it.x+rr,it.y); ctx.lineTo(it.x+it.w-rr,it.y);
        ctx.quadraticCurveTo(it.x+it.w,it.y,it.x+it.w,it.y+rr);
        ctx.lineTo(it.x+it.w,it.y+it.h-rr);
        ctx.quadraticCurveTo(it.x+it.w,it.y+it.h,it.x+it.w-rr,it.y+it.h);
        ctx.lineTo(it.x+rr,it.y+it.h);
        ctx.quadraticCurveTo(it.x,it.y+it.h,it.x,it.y+it.h-rr);
        ctx.lineTo(it.x,it.y+rr);
        ctx.quadraticCurveTo(it.x,it.y,it.x+rr,it.y); ctx.closePath();
      }
      ctx.fillStyle = it.fill; ctx.fill();
      if(it.stroke){ ctx.strokeStyle = it.stroke; ctx.lineWidth = it.sw||1; ctx.stroke(); }
    }
    else if(it.t==='circle'){
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.r, 0, Math.PI*2);
      ctx.fillStyle = it.fill; ctx.fill();
      if(it.stroke){
        ctx.strokeStyle = it.stroke; ctx.lineWidth = it.w;
        if(it.dash) ctx.setLineDash(it.dash.split(/\s+/).map(Number));
        ctx.stroke(); ctx.setLineDash([]);
      }
    }
    else if(it.t==='text') drawText(ctx, it);
    ctx.restore();
  }
}
function clipCanvasToPlot(ctx, items){
  var noClip = [], plot = [], i;
  for(i=0;i<items.length;i++){
    if(!items[i]) continue;
    (items[i].noClip ? noClip : plot).push(items[i]);
  }
  itemsToCanvas(ctx, noClip);
  ctx.save();
  ctx.beginPath(); ctx.rect(PLOT.x0, PLOT.y0, CW, CH); ctx.clip();
  itemsToCanvas(ctx, plot);
  ctx.restore();
}
function renderToCanvas(scale, transparent, withTitle){
  var items = buildItems(true);
  var cv = document.createElement('canvas');
  cv.width = Math.round(VB.w*scale);
  cv.height = Math.round(VB.h*scale);
  var ctx = cv.getContext('2d');
  ctx.setTransform(scale,0,0,scale,0,0);
  if(!transparent){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,VB.w,VB.h); }
  if(withTitle && S.title){
    drawText(ctx, {t:'text', x:VB.w/2, y:40, s:S.title, size:31, color:'#252523',
                   weight:600, anchor:'middle', halo:false});
  }
  clipCanvasToPlot(ctx, items);
  return cv;
}
function buildSVGString(withTitle){
  var items = buildItems(true), noClip = [], plot = [], i;
  for(i=0;i<items.length;i++){
    if(!items[i]) continue;
    (items[i].noClip ? noClip : plot).push(items[i]);
  }
  var defs = '<defs><clipPath id="pc"><rect x="'+PLOT.x0+'" y="'+PLOT.y0+
             '" width="'+CW+'" height="'+CH+'"/></clipPath></defs>';
  var titleXml = '';
  if(withTitle && S.title){
    titleXml = '<text x="'+(VB.w/2)+'" y="40" text-anchor="middle" style="font-family:'+FONT+
               ';font-size:31px;font-weight:600" fill="#252523">'+esc(S.title)+'</text>';
  }
  return '<?xml version="1.0" encoding="UTF-8"?>\n'+
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+VB.w+' '+VB.h+'" width="'+VB.w+
    '" height="'+VB.h+'">'+defs+'<rect width="100%" height="100%" fill="#ffffff"/>'+titleXml+
    itemsToSVG(noClip)+'<g clip-path="url(#pc)">'+itemsToSVG(plot)+'</g></svg>';
}

/* ---------- export ---------- */
function safeName(){
  var base = (S.title || 'econ-diagram').trim().replace(/[\\/:*?"<>|]+/g,'').slice(0,60);
  return base || 'econ-diagram';
}
function download(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}
function exportPNG(scale, transparent, withTitle){
  var cv = renderToCanvas(scale, transparent, withTitle);
  cv.toBlob(function(blob){
    download(blob, safeName()+'.png');
    toast('PNG saved ('+cv.width+'\u00d7'+cv.height+').');
  }, 'image/png');
}
function exportSVGFile(){
  download(new Blob([buildSVGString(true)], {type:'image/svg+xml;charset=utf-8'}), safeName()+'.svg');
  toast('SVG saved \u2014 vector, editable in PowerPoint.');
}
function copyPNG(){
  var cv = renderToCanvas(2, false, false);
  if(!navigator.clipboard || !window.ClipboardItem){
    cv.toBlob(function(b){ download(b, safeName()+'.png'); toast('Clipboard unavailable \u2014 PNG downloaded instead.'); });
    return;
  }
  cv.toBlob(function(blob){
    navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(function(){
      toast('Copied \u2014 now paste into PowerPoint or Word.');
    }, function(){
      download(blob, safeName()+'.png');
      toast('Clipboard blocked here \u2014 PNG downloaded instead.');
    });
  }, 'image/png');
}
/* ---------- snapping ---------- */
function snapMath(mx, my){
  var best = null, bd = Infinity, i, j, pts, pt, dd, c;
  for(i=0;i<S.curves.length;i++){
    c = S.curves[i];
    if(!c.visible) continue;
    pts = sampleCurve(c);
    for(j=0;j<pts.length;j++){
      pt = pts[j];
      dd = Math.sqrt((X(pt.x)-X(mx))*(X(pt.x)-X(mx)) + (Y(pt.y)-Y(my))*(Y(pt.y)-Y(my)));
      if(dd < bd){ bd = dd; best = pt; }
    }
  }
  for(i=0;i<S.eqHistory.length;i++){
    dd = Math.sqrt((X(S.eqHistory[i].x)-X(mx))*(X(S.eqHistory[i].x)-X(mx)) +
                   (Y(S.eqHistory[i].y)-Y(my))*(Y(S.eqHistory[i].y)-Y(my)));
    if(dd < bd){ bd = dd; best = {x:S.eqHistory[i].x, y:S.eqHistory[i].y}; }
  }
  if(best && bd < 11) return {x:best.x, y:best.y, snapped:true};
  if(S.axes.grid || S.axes.ticks) return {x: Math.round(mx/5)*5, y: Math.round(my/5)*5, snapped:false};
  return {x: mx, y: my, snapped:false};
}

/* ---------- interaction ---------- */
function toVB(evt){
  var pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  var mtx = svg.getScreenCTM();
  if(!mtx) return {x:0,y:0};
  return pt.matrixTransform(mtx.inverse());
}
function toMath(evt){
  var v = toVB(evt);
  return {x: clamp(invX(v.x),0,100), y: clamp(invY(v.y),0,100)};
}
var HINT = {

function renderInspector(force){
  /* read the open/closed state back out of the DOM before rebuilding, so a panel
     refresh (e.g. after removing an equilibrium) never slams the section shut */
  if(inspector){
    var ds = inspector.querySelectorAll('details[data-k]');
    for(var di=0; di<ds.length; di++) openDetails[ds[di].dataset.k] = ds[di].open;
  }
  var sc = (S.sel && S.sel.type==='curve') ? curveById(S.sel.id) : null;
  var key = JSON.stringify([S.sel?S.sel.type:'', S.sel?S.sel.id:'', S.curves.length, S.marks.length,
    S.activeD, S.activeS, S.eqHistory.length, sc?sc.shape:'', sc?sc.dash:'', sc?sc.visible:'',
    sc?sc.width:'', sc?sc.color:'', S.axes.ticks, S.axes.grid, S.opts.guides, S.opts.showHistory,
    S.opts.shiftArrow, S.opts.deltaBadges, S.opts.labelPQ, tool, !!S.ext,
    S.axes.yLabel, S.axes.xLabel, Object.keys(S.labelOff||{}).length]);
  if(!force && key===inspectorKey) return;
  inspectorKey = key;
  var html = '';
  if(!S.curves.length && !S.marks.length){
    html += '<div class="sec"><div class="empty">Empty canvas.<br>Use <b>Curve</b> on the left rail, or <b>Templates</b> in the header.</div></div>';
  }
  if(S.sel){
    var o = (S.sel.type==='curve') ? curveById(S.sel.id) : markById(S.sel.id);
    if(o) html += (S.sel.type==='curve' ? curveRows(o) : markRows(o));
    else S.sel = null;
  }
  /* keep the panel short: canvas-wide options only when nothing is selected */
  if(!S.sel){
    if(tool === 'region') html += shadeRows();
    html += globalRows();
  } else {
    /* The panel stays focused on the selected object, but hiding the axes and
       display options outright meant clicking a curve to change its colour also
       cost you the ability to see the axis names. They stay, folded away. */
    html += det('canvas', 'Axes &amp; display', 'var(--c-axis)') + globalRows() + '</details>';
    html += '<div class="sec"><div class="empty">'+
      'Click empty space to clear the selection.'+
      '</div></div>';
  }
  inspector.innerHTML = html;
}

/* ---------- popovers ---------- */
function closePop(){ if(popoverEl){ popoverEl.remove(); popoverEl = null; } }
function openPop(html, anchorEl, width){
  closePop();
  var host = document.getElementById('stage');
  var p = document.createElement('div');
  p.className = 'pop';
  p.innerHTML = html;
  if(width) p.style.width = width+'px';
  host.appendChild(p);
  var r = anchorEl.getBoundingClientRect(), hr = host.getBoundingClientRect();
  var w = p.offsetWidth || width || 240;
  var topPx = Math.max(6, (r.bottom - hr.top) + 6);
  p.style.left = clamp(r.left - hr.left, 8, Math.max(8, hr.width - w - 8)) + 'px';
  p.style.top  = topPx + 'px';
  /* cap the height against the popover's OWN top, not the whole stage: otherwise
     the tail of a long menu is clipped by the stage and becomes unreachable */
  p.style.maxHeight = Math.max(180, hr.height - topPx - 10) + 'px';
  popoverEl = p;
  return p;
}

document.addEventListener('click', function(ev){
  var p = popoverEl;
  if(!p) return;
  var add = ev.target.closest ? ev.target.closest('[data-add]') : null;
  if(add) return;
  var tpl = ev.target.closest ? ev.target.closest('[data-tpl]') : null;
  if(tpl){
    closePop();

    else applyTemplate(tpl.dataset.tpl);

  }
  var pax = ev.target.closest ? ev.target.closest('[data-ppcaxis]') : null;
  if(pax){ closePop(); setPPCAxes(pax.dataset.ppcaxis); return; }
  var sc = ev.target.closest ? ev.target.closest('[data-scale]') : null;
  if(sc){
    var all = p.querySelectorAll('[data-scale]');
    for(var i=0;i<all.length;i++) all[i].classList.toggle('on', all[i]===sc);
    exportMenu.s.scale = +sc.dataset.scale;

    if(px) px.textContent = VB.w*exportMenu.s.scale+'\u00d7'+VB.h*exportMenu.s.scale+' px';
    return;
  }
  var bg = ev.target.closest ? ev.target.closest('[data-bg]') : null;
  if(bg){
    var all2 = p.querySelectorAll('[data-bg]');
    for(var j=0;j<all2.length;j++) all2[j].classList.toggle('on', all2[j]===bg);
    exportMenu.s.transparent = (bg.dataset.bg==='t');
    return;
  }
  var ti = ev.target.closest ? ev.target.closest('[data-title]') : null;
  if(ti){
    var all3 = p.querySelectorAll('[data-title]');
    for(var k2=0;k2<all3.length;k2++) all3[k2].classList.toggle('on', all3[k2]===ti);
    exportMenu.s.title = (ti.dataset.title==='1');

  var doo = ev.target.closest ? ev.target.closest('[data-do]') : null;

    closePop();
